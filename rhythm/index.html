  function renderWelcome(){return `<div class="welcome" style="margin-bottom:22px"><div class="caps" style="color:#c8ef71">WELCOME TO RHYTHM</div><h2>未来を変えるのは、今日の仕組み。</h2><p>まず1つだけ習慣を登録してみましょう。毎日の実行をチェックすると、記録と分析が自動で積み重なります。</p><div class="chips"><button class="btn primary" data-action="new" data-kind="habit">${ico('plus','sm')} 自分で登録</button><button class="btn" data-action="template" data-template="far">FAR学習の例を追加</button><button class="btn" data-action="template" data-template="words">英単語の例を追加</button></div></div>`;}
  function renderHabitCard(h,d){const log=habitLog(h.id,d),st=statusMeta(log),isFuture=d>todayKey(),flex=h.frequency==='weekly',completed=log&&['done','minimum'].includes(log.status);return `<article class="habit-card ${completed?'done':''}"><div class="habit-top"><div class="status-square ${st.kind==='done'?'done':st.kind==='partial'?'partial':''}">${ico(st.kind==='done'?'check':st.kind==='partial'?'bolt':h.category==='学習'?'book':'repeat')}</div><div class="habit-body"><div class="habit-name">${esc(h.title)}</div><div class="habit-meta"><span>${esc(h.category||'その他')}</span><span>${flex?`週${nfmt(h.weeklyTarget||3)}回・現在${weeklyHabitDone(h,d)}回`:'標準 '+nfmt(h.normalTarget||1)+esc(h.unit||'回')}</span>${h.cue?`<span>${ico('bolt','sm')}${esc(h.cue)}</span>`:''}</div></div>${flex?'<span class="pill blue">週内で自由</span>':''}</div><div class="habit-actions"><div class="action-left">${!isFuture?`${!log||log.status==='skipped'||log.status==='rest'?`<button class="btn sm primary" data-action="logquick" data-id="${attr(h.id)}" data-amount="standard">${ico('check','sm')} 完了</button><button class="btn sm" data-action="logquick" data-id="${attr(h.id)}" data-amount="minimum">最低ライン</button>`:''}<button class="btn sm ghost" data-action="record" data-id="${attr(h.id)}">${ico('edit','sm')}${log?'編集':'記録'}</button>`:'<span class="muted" style="font-size:11px">実行は当日以降に記録できます</span>'}</div><div class="action-right">${log?`<span class="status-text ${st.kind}">${st.label}${isExecuted(log)?` · ${nfmt(log.amount)}${esc(log.unit||h.unit||'回')}`:''}</span>`:''}<button class="detail-action" aria-label="習慣の設定" data-action="edit" data-kind="habit" data-id="${attr(h.id)}">${ico('more')}</button></div></div></article>`;}

  function renderRoutineRow(r,d){const log=routineLog(r.id,d),done=(log?.completed||[]).length,total=(r.steps||[]).length;return `<div class="routine-row"><div class="routine-line"><div><strong style="font-size:13px">${esc(r.title)}</strong><p class="muted" style="font-size:11px;margin-top:5px">${done} / ${total} ステップ完了</p></div><button class="btn sm" data-action="routine-run" data-id="${attr(r.id)}">${ico('check','sm')} チェック</button></div><div class="routine-progress"><span style="width:${total?done/total*100:0}%"></span></div></div>`;}

  function freqLabel(h){if(h.frequency==='daily')return '毎日';if(h.frequency==='weekdays')return '平日';if(h.frequency==='custom')return (h.days||[]).map(d=>WEEKDAYS[d]).join('・')+'曜日';if(h.frequency==='weekly')return `週${h.weeklyTarget||3}回`;if(h.frequency==='monthly')return `毎月${h.monthDay||1}日`;return '毎日';}
  function renderHabitList(){return `<div class="stack">${state.habits.length?state.habits.map(h=>`<div class="list-card"><div class="row-left"><div class="list-icon">${ico(h.category==='学習'?'book':'repeat','lg')}</div><div class="row-body"><div class="row-title">${esc(h.title)} ${h.active===false?'<span class="pill">停止中</span>':''}</div><div class="row-sub"><span>${esc(h.category||'その他')}</span><span>・ ${esc(freqLabel(h))}</span><span>・ 標準 ${nfmt(h.normalTarget)}${esc(h.unit)}</span><span>・ 最低 ${nfmt(h.minimumTarget)}${esc(h.unit)}</span></div>${h.cue?`<div class="row-sub mt8">${ico('bolt','sm')} もし ${esc(h.cue)} → 実行する</div>`:''}${h.goalId&&getGoal(h.goalId)?`<div class="row-sub mt8">${ico('target','sm')} ${esc(getGoal(h.goalId).title)}</div>`:''}</div></div><div class="row-actions"><button class="btn sm ghost" data-action="edit" data-kind="habit" data-id="${attr(h.id)}" aria-label="編集">${ico('edit','sm')}</button></div></div>`).join(''):blank('repeat','まだ習慣がありません','最初は1つだけ、続けたい行動を登録するのがおすすめです。','habit','習慣を追加')}

  function renderTaskList(){const open=state.tasks.filter(t=>t.status!=='done').sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999')),done=state.tasks.filter(t=>t.status==='done').sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));return `<div class="card"><div class="card-header"><span class="card-title">未完了タスク</span><span class="pill">${open.length}件</span></div>${open.length?open.map(t=>renderTaskRow(t)).join(''):blank('check','未完了タスクはありません','単発のやるべきことを登録して、習慣と分けて管理できます。','task','タスクを追加')}</div>${done.length?`<div class="card mt18"><div class="card-header"><span class="card-title">完了済み</span><span class="pill">${done.length}件</span></div>${done.slice(0,25).map(renderTaskRow).join('')}</div>`:''}`;}
  function renderRoutineList(){return `<div class="stack">${state.routines.length?state.routines.map(r=>`<div class="list-card"><div class="row-left"><div class="list-icon">${ico('layers','lg')}</div><div class="row-body"><div class="row-title">${esc(r.title)} ${r.active===false?'<span class="pill">停止中</span>':''}</div><div class="row-sub">${esc(freqLabel(r))} ・ ${(r.steps||[]).length}ステップ ・ ${esc(r.category||'暮らし')}</div><p class="muted mt8" style="font-size:11px;line-height:1.7">${(r.steps||[]).map(x=>esc(x.title)).join(' → ')}</p></div></div><div class="row-actions"><button class="btn sm" data-action="routine-run" data-id="${attr(r.id)}">実行</button><button class="btn sm ghost" data-action="edit" data-kind="routine" data-id="${attr(r.id)}">${ico('edit','sm')}</button></div></div>`).join(''):blank('layers','ルーティンがありません','「勉強前の準備」など、複数の行動を順番にまとめます。','routine','ルーティンを追加')}</div>`;}
  function renderProjectList(){return `<div class="stack">${state.projects.length?state.projects.map(p=>{const tasks=state.tasks.filter(t=>t.projectId===p.id),done=tasks.filter(t=>t.status==='done').length,rate=tasks.length?Math.round(done/tasks.length*100):0;return `<div class="card"><div class="card-header"><div><div class="caps muted">PROJECT / ${esc(p.category||'その他')}</div><h3 class="project-heading">${esc(p.title)}</h3>${p.dueDate?`<p class="muted" style="font-size:11px;margin-top:5px">期限 ${formatShort(p.dueDate)}</p>`:''}</div><button class="btn sm ghost" data-action="edit" data-kind="project" data-id="${attr(p.id)}">${ico('edit','sm')} 編集</button></div><div class="goal-foot mb12"><span class="muted" style="font-size:12px">タスク ${done} / ${tasks.length}件</span><span class="goal-percent">${rate}%</span></div><div class="meter"><span style="width:${rate}%"></span></div><div class="mt12">${tasks.length?tasks.map(renderTaskRow).join(''):'<p class="muted" style="font-size:12px">まだタスクはありません。</p>'}</div><button class="btn sm mt12" data-action="project-task" data-id="${attr(p.id)}">${ico('plus','sm')} このプロジェクトにタスク追加</button></div>`;}).join(''):blank('layers','プロジェクトはまだありません','目標の達成に必要な複数の作業をまとめられます。','project','プロジェクトを作る')}</div>`;}
  function renderWeekPlan(){const week=startOfWeek(currentKey());let cols=[];for(let i=0;i<7;i++){const d=addDays(week,i),habits=state.habits.filter(h=>isHabitScheduled(h,d)),routines=state.routines.filter(r=>isRoutineScheduled(r,d)),tasks=state.tasks.filter(t=>t.dueDate===d);cols.push(`<div class="calendar-cell ${d===todayKey()?'today':''}" style="min-height:82px"><button data-action="goto-date" data-date="${d}"><strong>${formatShort(d)} (${WEEKDAYS[dateOf(d).getDay()]})</strong><p class="muted" style="font-size:10px;margin-top:7px">習慣 ${habits.length}</p><p class="muted" style="font-size:10px">予定 ${tasks.length+routines.length}</p>${dayStats(d).done?`<div class="dotted" style="margin:6px auto 0"></div>`:''}</button></div>`);}return `<div class="card"><div class="card-header"><span class="card-title">${formatShort(week)}〜${formatShort(addDays(week,6))}</span><div class="day-switch"><button data-action="week-prev">${ico('left','sm')}</button><button data-action="week-next">${ico('right','sm')}</button></div></div><div class="calendar-grid">${cols.join('')}</div><div class="line"></div>${state.habits.filter(h=>h.frequency==='weekly'&&h.active!==false).length?`<div class="section-gap"><strong>曜日自由の週間目標</strong>${state.habits.filter(h=>h.frequency==='weekly'&&h.active!==false).map(h=>{const a=weeklyHabitDone(h,week),t=num(h.weeklyTarget,1);return `<div class="breakdown-row"><strong>${esc(h.title)}</strong><div class="meter"><span style="width:${cap(a/t*100,0,100)}%"></span></div><span>${a}/${t}回</span></div>`}).join('')}</div>`:''}<div class="line"></div><p class="muted" style="font-size:12px;line-height:1.8">曜日固定の習慣・ルーティン、締切タスクを表示しています。週◯回の柔軟な習慣は、曜日に固定していないためこの件数に含みません。</p></div>`;}
  function renderGoals(){const filter=ui.goalFilter;const goals=state.goals.filter(g=>filter==='all'||g.category===filter);return `<div class="page-header"><div><div class="eyebrow">DIRECTION & PURPOSE</div><h1>目指す場所を明確に。</h1><p class="page-sub">結果目標と、そこに至る行動を紐づけます。</p></div><div class="page-actions">${buttonAdd('goal','目標を追加')}</div></div><div class="filter-tabs"><button class="filter-tab ${filter==='all'?'active':''}" data-action="filter-goal" data-filter="all">すべて</button>${CATEGORIES.map(c=>`<button class="filter-tab ${c===filter?'active':''}" data-action="filter-goal" data-filter="${esc(c)}">${esc(c)}</button>`).join('')}</div>${goals.length?`<div class="goals-grid">${goals.map(renderGoalCard).join('')}</div>`:blank('target','このカテゴリーの目標はありません','成果の指標と期限を決めると、行動の目的が明確になります。','goal','目標を登録')}`;}
  function renderGoalCard(g){const target=num(g.targetValue,0),current=num(g.currentValue,0),pct=target>0?cap(Math.round(current/target*100),0,100):0,linked=state.habits.filter(h=>h.goalId===g.id).length;return `<article class="goal-card"><div class="goal-head"><div><div class="caps muted" style="margin-bottom:11px">${esc(g.category||'その他')} / GOAL</div><div class="goal-title">${esc(g.title)}</div>${g.dueDate?`<p class="muted mt8" style="font-size:11px">期限 ${esc(formatDate(g.dueDate,{year:'numeric',month:'short',day:'numeric'}))}</p>`:''}</div><button class="btn sm ghost" data-action="edit" data-kind="goal" data-id="${attr(g.id)}" aria-label="編集">${ico('edit','sm')}</button></div><div><div class="goal-foot mb12"><span class="goal-stats">${nfmt(current)} / ${nfmt(target)} ${esc(g.unit||'')}</span><span class="goal-percent">${pct}%</span></div><div class="goal-progress"><span style="width:${pct}%"></span></div></div><div class="goal-foot"><span class="muted" style="font-size:11px">${linked}個の習慣と連携</span><button class="btn sm" data-action="goal-progress" data-id="${attr(g.id)}">${ico('plus','sm')} 進捗を更新</button></div></article>`;}
  function renderInsights(){const range=ui.insightRange,stats=periodStats(range),days=rangeDays(todayKey(),range),week=startOfWeek(todayKey()),review=state.reviews.find(r=>r.weekStart===week);let groups=CATEGORIES.map(c=>({name:c,planned:0,done:0}));days.forEach(d=>{state.habits.filter(h=>isHabitScheduled(h,d)).forEach(h=>{if(habitLog(h.id,d)?.status==='rest')return;const g=groups.find(g=>g.name===(h.category||'その他'))||groups.at(-1);g.planned++;if(['done','minimum'].includes(habitLog(h.id,d)?.status))g.done++;});});groups=groups.filter(g=>g.planned>0);const weeklyFlexible=state.habits.filter(h=>h.frequency==='weekly'&&h.active!==false);const missCauses={};state.habitLogs.filter(l=>days.includes(l.date)&&['skipped','partial'].includes(l.status)&&l.reason).forEach(l=>{missCauses[l.reason]=(missCauses[l.reason]||0)+1;});const maxVal=Math.max(1,...days.map(d=>dayStats(d).planned));return `<div class="page-header"><div><div class="eyebrow">MEASURE, LEARN, IMPROVE</div><h1>数字から、改善する。</h1><p class="page-sub">チェックの数だけではなく、行動量と成果も確認します。</p></div><div class="page-actions"><button class="btn primary" data-action="review">${ico('book','sm')} 週次レビュー</button></div></div>

    <div class="metric-grid" style="margin:17px 0 20px"><div class="metric-card"><div class="caps muted">予定の実行率</div><div class="large">${stats.rate===null?'—':stats.rate+'%'}</div><p class="muted" style="font-size:11px">${stats.done} / ${stats.planned} 件（休息除く）</p></div><div class="metric-card"><div class="caps muted">記録した実行時間</div><div class="large">${nfmt(stats.mins)}<span style="font-size:14px;color:var(--low)">分</span></div><p class="muted" style="font-size:11px">単位「分」の習慣から集計</p></div><div class="metric-card"><div class="caps muted">標準量の達成件数</div><div class="large">${stats.standard}</div><p class="muted" style="font-size:11px">最低ライン達成とは区別</p></div><div class="metric-card"><div class="caps muted">未記録（習慣）</div><div class="large">${stats.missing}</div><p class="muted" style="font-size:11px">未実行とは判定していません</p></div></div>
    ${weeklyFlexible.length?`<div class="card mb12"><div class="card-header"><span class="card-title">今週の回数目標（曜日自由）</span></div>${weeklyFlexible.map(h=>{const done=weeklyHabitDone(h,todayKey()),target=num(h.weeklyTarget,3);return `<div class="breakdown-row"><strong>${esc(h.title)}</strong><div class="meter"><span style="width:${cap(done/target*100,0,100)}%"></span></div><span class="muted" style="text-align:right">${done}/${target}</span></div>`;}).join('')}</div>`:''}
    <div class="grid-main"><div class="stack"><div class="card"><div class="card-header"><span class="card-title">日別の実行</span><span class="pill">完了件数 / 予定件数</span></div><div class="bar-chart">${(range===30?days.filter((_,i)=>i%2===0||i===days.length-1):days).map(d=>{const s=dayStats(d);return `<div class="bar-wrap" title="${formatShort(d)}: ${s.done}/${s.planned}"><div class="bar-track" style="max-width:${range===7?'30px':'20px'}"><span style="height:${s.planned?Math.max(3,s.done/maxVal*100):0}%"></span></div><span class="bar-label">${range===7?WEEKDAYS[dateOf(d).getDay()]:dateOf(d).getDate()}</span></div>`;}).join('')}</div><p class="muted mt12" style="font-size:11px">予定に対して実際に着手・達成できた件数を表示。棒の高さは完了件数です。</p></div>
    <div class="card"><div class="card-header"><span class="card-title">カテゴリー別の実行率</span></div>${groups.length?groups.map(g=>`<div class="breakdown-row"><strong>${esc(g.name)}</strong><div class="meter"><span style="width:${Math.round(g.done/g.planned*100)}%"></span></div><span class="muted" style="text-align:right">${Math.round(g.done/g.planned*100)}%</span></div>`).join(''):blank('chart','分析する記録がありません','習慣を登録するとここにデータが表示されます。')}</div></div>
    <div class="stack right-column"><div class="card"><div class="card-header"><span class="card-title">実行を妨げた理由</span></div>${Object.keys(missCauses).length?Object.entries(missCauses).sort((a,b)=>b[1]-a[1]).map(([name,count])=>`<div class="info-row"><div class="title">${esc(name)}</div><span class="pill">${count}件</span></div>`).join(''):'<p class="muted" style="font-size:12px;line-height:1.8">未実行の理由を記録すると、ここに傾向が表示されます。</p>'}</div>
    <div class="card"><div class="card-header"><span class="card-title">AIと仕組みを改善</span>${ico('spark')}</div><p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:12px">チェック記録を含む分析用プロンプトをコピーしてChatGPTへ貼り付け。返答のJSONを確認してから取り込みます。</p><div class="split"><button class="btn" data-action="ai-prompt">${ico('book','sm')} 分析プロンプト</button><button class="btn" data-action="ai-import">${ico('upload','sm')} 提案を取り込む</button></div><p class="muted mt12" style="font-size:11px">プロンプトには登録した目標・習慣・実績が含まれます。共有前に内容を確認してください。</p></div>
    <div class="card"><div class="card-header"><span class="card-title">今週の改善</span><span class="pill ${review?'accent':''}">${review?'記録済み':'未記録'}</span></div>${review?`<div class="caps muted" style="margin-bottom:8px">NEXT ACTION</div><p style="line-height:1.8">${esc(review.adjustment||'改善策は未記入です。')}</p><p class="muted mt12" style="font-size:11px">次の最重要行動：${esc(review.focus||'未設定')}</p>`:'<p class="muted" style="font-size:12px;line-height:1.8">改善することを1つ決めるだけでも、翌週の行動が明確になります。</p>'}<button class="btn wide mt18" data-action="review">${ico('edit','sm')} ${review?'レビューを編集':'レビューを記録'}</button></div><div class="card"><div class="card-header"><span class="card-title">記録の読み方</span></div><p class="muted" style="font-size:11px;line-height:1.9">実行率は予定のある習慣・ルーティン・期限付きタスクが対象です。週◯回の柔軟な習慣は、曜日固定ではないため含まず、習慣の詳細で週内回数を確認します。目標進捗は目標画面で管理します。</p></div></div></div>`;}
  function renderSettings(){return `<div class="page-header"><div><div class="eyebrow">PREFERENCES & SAFETY</div><h1>設定とデータ。</h1><p class="page-sub">大切な記録は、この端末に保存されています。</p></div></div>
    <div class="grid-main"><div class="stack"><div class="card"><div class="card-header"><span class="card-title">アプリ設定</span>${ico('settings')}</div><div class="info-row"><div><div class="title">表示テーマ</div><p>見やすい色を選択</p></div><div class="segmented"><button data-action="theme" data-theme="dark" class="${state.settings.theme==='dark'?'active':''}">Dark</button><button data-action="theme" data-theme="light" class="${state.settings.theme==='light'?'active':''}">Light</button></div></div><div class="info-row"><div><div class="title">1日の区切り</div><p>深夜の記録を前日の扱いにする時刻</p></div><select id="cutover" data-setting="cutover" aria-label="1日の区切り">${[0,1,2,3,4,5,6].map(n=>`<option value="${n}" ${Number(state.settings.dayBoundaryHour)===n?'selected':''}>${n}:00</option>`).join('')}</select></div></div>
    <div class="card"><div class="card-header"><span class="card-title">はじめるためのテンプレート</span>${ico('spark')}</div><p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:12px">必要なものだけを追加できます。習慣の時間・頻度・条件は後から自由に編集できます。</p><div class="template-list">${[['study','FAR学習'],['vocab','英単語復習'],['fitness','筋トレ'],['finance','週1回の家計確認'],['reset','夜のリセット']].map(([k,l])=>`<button class="btn sm" data-action="starter" data-template="${k}">${ico('plus','sm')} ${l}</button>`).join('')}</div></div>
    <div class="card"><div class="card-header"><span class="card-title">予定のリマインド</span>${ico('calendar')}</div><p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:12px">チェックする時間の予定をカレンダー用ファイルに出力します。端末のカレンダーへ読み込むと、アプリを開いていない時間にも端末側の通知を利用できます。</p><div class="info-row"><div><div class="title">リマインド時刻</div><p>対象の習慣を60日先まで出力</p></div><input type="time" data-setting="reminder-time" aria-label="リマインド時刻" value="${attr(state.settings.reminderTime||'20:30')}" style="width:130px"></div><div class="split"><button class="btn primary" data-action="export-ics">${ico('calendar','sm')} カレンダーに出力</button><button class="btn" data-action="export-csv">${ico('download','sm')} 実績CSV出力</button></div><p class="muted mt12" style="font-size:11px;line-height:1.7">同じファイルを繰り返し取り込むと予定が重複することがあります。曜日自由の週○回タイプは日付が確定していないため、カレンダーへの自動出力から除外されます。</p></div>

    <div class="card"><div class="card-header"><span class="card-title">復旧用スナップショット</span>${ico('undo')}</div><p class="muted" style="font-size:12px;line-height:1.8">データ復元や全削除の直前に、元の記録を端末内に1つ保存します。誤操作した場合に直前の状態を戻せます。同じ端末内の保存なので、紛失・消去への対策にはJSONバックアップが必要です。</p><button class="btn mt12" data-action="recovery">${ico('undo','sm')} 直前の状態に戻す</button></div>

    <div class="card"><div class="card-header"><span class="card-title">ホーム画面に追加</span>${ico('home')}</div><p class="muted" style="font-size:12px;line-height:1.9">GitHub PagesなどHTTPSのURLで公開し、iPhoneのSafariで開く → 共有 →「ホーム画面に追加」。追加後はホーム画面アイコンから利用してください。</p><div class="line"></div><p class="muted" style="font-size:11px;line-height:1.8">PWAのオフライン機能はHTTPSでの公開後に利用できます。ローカルファイルとして開いた場合はホーム画面登録・保存に制限がある場合があります。</p></div>

  function categoryField(value='学習'){return `<div class="field"><label for="category">カテゴリー</label><select name="category" id="category">${CATEGORIES.map(c=>`<option value="${esc(c)}" ${value===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`;}

  function scheduleFields(item={}){const frequency=item.frequency||'daily';return `<div class="field"><label for="frequency">頻度</label><select name="frequency" id="frequency" data-field="frequency"><option value="daily" ${frequency==='daily'?'selected':''}>毎日</option><option value="weekdays" ${frequency==='weekdays'?'selected':''}>平日（月〜金）</option><option value="custom" ${frequency==='custom'?'selected':''}>曜日を指定</option><option value="weekly" ${frequency==='weekly'?'selected':''}>週◯回（曜日自由）</option><option value="monthly" ${frequency==='monthly'?'selected':''}>月1回（指定日）</option></select></div><div class="field" data-freq="custom" ${frequency==='custom'?'':'hidden'}><label>実行する曜日</label><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<label class="day-chip"><input type="checkbox" name="days" value="${d}" ${(item.days||[]).includes(d)?'checked':''}><span>${WEEKDAYS[d]}</span></label>`).join('')}</div></div><div class="field" data-freq="weekly" ${frequency==='weekly'?'':'hidden'}><label for="weeklyTarget">1週間の実行回数</label><input id="weeklyTarget" name="weeklyTarget" type="number" min="1" max="7" value="${cap(num(item.weeklyTarget,3),1,7)}"></div><div class="field" data-freq="monthly" ${frequency==='monthly'?'':'hidden'}><label for="monthDay">毎月の日付</label><input id="monthDay" name="monthDay" type="number" min="1" max="31" value="${cap(num(item.monthDay,1),1,31)}"><p class="help">31日がない月は月末日に実行予定となります。</p></div>`;}

  function renderModal(){const root=document.getElementById('modal-root');const modal=ui.modal;if(!modal){root.innerHTML='';return;}let markup='';const item=modal.id?(({habit:getHabit,goal:getGoal,task:getTask,project:getProject,routine:getRoutine})[modal.kind]?.(modal.id)):null;
    if(modal.kind==='quick'){markup=wrapModal('何を追加しますか？','使う目的に合わせて選択してください。',`<div class="stack">${[['habit','repeat','習慣を追加','繰り返す行動を習慣化'],['task','check','タスクを追加','1回で終わるやるべきこと'],['project','layers','プロジェクトを追加','複数のタスクをまとめて達成'],['goal','target','目標を追加','成果の指標と期限を決める'],['routine','layers','ルーティンを追加','複数の行動を一つの流れに']].map(([kind,icon,title,sub])=>`<button class="list-card" data-action="new" data-kind="${kind}" style="width:100%;text-align:left;color:var(--text)"><div class="row-left"><div class="list-icon">${ico(icon,'lg')}</div><div class="row-body"><div class="row-title">${title}</div><div class="row-sub">${sub}</div></div></div>${ico('right')}</button>`).join('')}</div>`,'',true);}
    else if(modal.kind==='habit')markup=wrapModal(item?'習慣を編集':'新しい習慣','実行する条件と最低ラインを決めます。',`<form id="entity-form" data-form="habit"><div class="field"><label for="title">習慣の名前 *</label><input id="title" name="title" required maxlength="100" placeholder="例：FARの問題演習" value="${attr(item?.title||'')}"></div><div class="field-grid">${categoryField(item?.category||'学習')}${goalField(item?.goalId||'')}</div><div class="form-section"><h3>いつ・どのくらい行う？</h3>${scheduleFields(item||{})}<div class="field-grid"><div class="field"><label for="normalTarget">標準量 *</label><input id="normalTarget" name="normalTarget" type="number" min="0.01" max="1000000" step="any" required value="${attr(item?.normalTarget??60)}"></div><div class="field"><label for="minimumTarget">最低ライン *</label><input id="minimumTarget" name="minimumTarget" type="number" min="0.01" max="1000000" step="any" required value="${attr(item?.minimumTarget??5)}"></div></div><div class="field-grid"><div class="field"><label for="unit">単位</label><select id="unit" name="unit">${['分','問','語','回','ページ','円','件','km','その他'].map(u=>`<option value="${u}" ${u===(item?.unit||'分')?'selected':''}>${u}</option>`).join('')}</select></div><div class="field"><label for="priority">優先度</label><select name="priority" id="priority">${[[3,'高'],[2,'中'],[1,'低']].map(([n,l])=>`<option value="${n}" ${n===num(item?.priority,2)?'selected':''}>${l}</option>`).join('')}</select></div></div></div><div class="form-section"><h3>やる気に頼らない設計</h3><div class="field"><label for="cue">実行のきっかけ（If）</label><input name="cue" id="cue" maxlength="180" placeholder="例：夕食を終えて着替えたら" value="${attr(item?.cue||'')}"><span class="help">「もし〇〇したら、この習慣を始める」と決めます。</span></div><div class="field"><label for="fallback">できないときの代替行動</label><input name="fallback" id="fallback" maxlength="180" placeholder="例：講義ではなく前日の復習を1問" value="${attr(item?.fallback||'')}"></div><div class="field-grid"><div class="field"><label for="startDate">開始日</label><input type="date" name="startDate" id="startDat   function openModal(kind,id,defaults={}){ui.modal={kind,id:id||null,...defaults};renderModal();const el=document.querySelector('.modal');el?.scrollTo(0,0);document.querySelector('.modal [name="title"]')?.focus({preventScroll:true});}
  function closeModal(){ui.modal=null;renderModal();}
  function upsertLog(h,amount,forcedStatus=null,reason='',notes=''){const day=currentKey();if(day>todayKey()){toast('未来の日付には実績を記録できません。');return;}const q=num(amount);let status=forcedStatus|| (q>=num(h.normalTarget,1)?'done':q>=num(h.minimumTarget,1)?'minimum':q>0?'partial':'skipped');if(['rest','skipped'].includes(status))amount=0;const old=habitLog(h.id,day);const record={id:old?.id||uid(),habitId:h.id,date:day,amount:num(amount),unit:h.unit||'回',status,reason,notes,updatedAt:new Date().toISOString()};if(old)Object.assign(old,record);else state.habitLogs.push(record);commit();}
  function saveForm(form){const kind=form.dataset.form;const fd=new FormData(form);const get=name=>String(fd.get(name)??'').trim();const old=ui.modal?.id;try{
    if(kind==='habit'){
      const normalTarget=num(get('normalTarget')),minimumTarget=num(get('minimumTarget'));
      if(!(normalTarget>0)||!(minimumTarget>0)||minimumTarget>normalTarget)throw Error('最低ラインは0より大きく、標準量以下にしてください。');
      const frequency=get('frequency'),days=fd.getAll('days').map(Number);
      if(frequency==='custom'&&days.length===0)throw Error('実行曜日を1つ以上選択してください。');
      if(get('startDate')&&get('endDate')&&get('endDate')<get('startDate'))throw Error('終了日は開始日より後にしてください。');
      const record={title:get('title'),category:get('category'),goalId:get('goalId'),frequency,days,weeklyTarget:cap(num(get('weeklyTarget'),3),1,7),monthDay:cap(num(get('monthDay'),1),1,31),normalTarget,minimumTarget,unit:get('unit'),priority:num(get('priority'),2),cue:get('cue'),fallback:get('fallback'),startDate:get('startDate')||todayKey(),endDate:get('endDate'),notes:get('notes'),active:fd.has('active')};
      if(!record.title)throw Error('習慣名を入力してください。');const prev=getHabit(old);if(prev)Object.assign(prev,record,{updatedAt:new Date().toISOString()});else state.habits.push({id:uid(),...record,createdAt:new Date().toISOString()});
    } else if(kind==='project'){
      const record={title:get('title'),category:get('category'),goalId:get('goalId'),dueDate:get('dueDate'),notes:get('notes')};if(!record.title)throw Error('プロジェクト名を入力してください。');const prev=getProject(old);if(prev)Object.assign(prev,record);else state.projects.push({id:uid(),...record,createdAt:new Date().toISOString()});
    } else if(kind==='task'){
      const record={title:get('title'),category:get('category'),goalId:get('goalId'),projectId:get('projectId'),dueDate:get('dueDate'),priority:num(get('priority'),2),notes:get('notes')};if(!record.title)throw Error('タスク名を入力してください。');const prev=getTask(old);if(prev)Object.assign(prev,record);else state.tasks.push({id:uid(),...record,status:'todo',createdAt:new Date().toISOString()});
    } else if(kind==='goal'){
      const targetValue=num(get('targetValue'));
      if(!(targetValue>0))throw Error('目標値は0より大きい値にしてください。');const record={title:get('title'),category:get('category'),dueDate:get('dueDate'),currentValue:Math.max(0,num(get('currentValue'))),targetValue,unit:get('unit'),notes:get('notes')};if(!record.title)throw Error('目標名を入力してください。');const prev=getGoal(old);if(prev)Object.assign(prev,record);else state.goals.push({id:uid(),...record,createdAt:new Date().toISOString()});
    } else if(kind==='routine'){
      const lines=get('steps').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,50);if(!lines.length)throw Error('ステップを1つ以上入力してください。');const prev=getRoutine(old);const frequency=get('frequency'),days=fd.getAll('days').map(Number);if(frequency==='custom'&&days.length===0)throw Error('実行曜日を1つ以上選んでください。');const steps=lines.map((title,i)=>({id:(prev?.steps?.[i]?.title===title?prev.steps[i].id:null)||uid(),title}));const record={title:get('title'),category:get('category'),steps,frequency,days,weeklyTarget:cap(num(get('weeklyTarget'),3),1,7),monthDay:cap(num(get('monthDay'),1),1,31),active:fd.has('active'),startDate:prev?.startDate||todayKey()};if(!record.title)throw Error('ルーティン名を入力してください。');if(prev)Object.assign(prev,record);else state.routines.push({id:uid(),...record,createdAt:new Date().toISOString()});
    } else if(kind==='ai-import'){applyAIAdvice(get('advice'));return;
    } else if(kind==='record'){
      const h=getHabit(ui.modal.id);if(!h)throw Error('習慣が見つかりません。');const mode=get('recordStatus'),amount=num(get('amount'));if(amount<0)throw Error('実績量は0以上で入力してください。');upsertLog(h,amount,mode==='auto'?null:mode,get('reason'),get('notes'));closeModal();toast('実績を保存しました');return;
    } else if(kind==='goal-progress'){
      const g=getGoal(ui.modal.id);if(!g)throw Error('目標が見つかりません。');const value=num(get('currentValue'));if(value<0)throw Error('現在値は0以上で入力してください。');g.currentValue=value;
    } else if(kind==='daily-review'){
      const d=currentKey(),prev=dailyReview(d),record={date:d,energy:cap(num(get('energy'),3),1,5),focus:cap(num(get('focus'),3),1,5),highlight:get('highlight'),obstacle:get('obstacle'),tomorrow:get('tomorrow'),adjustment:get('adjustment'),updatedAt:new Date().toISOString()};if(prev)Object.assign(prev,record);else state.dailyReviews.push({id:uid(),...record});
    } else if(kind==='review'){
      const week=startOfWeek(currentKey()),prev=state.reviews.find(r=>r.weekStart===week),record={weekStart:week,win:get('win'),obstacle:get('obstacle'),adjustment:get('adjustment'),focus:get('focus'),energy:cap(num(get('energy'),3),1,5),updatedAt:new Date().toISOString()};if(prev)Object.assign(prev,record);else state.reviews.push({id:uid(),...record});
    } else return;
    closeModal();commit();toast('保存しました');
  }catch(err){toast(err.message||'保存できませんでした。');}}
  function deleteEntity(kind,id){const title=({habit:getHabit,goal:getGoal,task:getTask,project:getProject,routine:getRoutine})[kind]?.(id)?.title||'この項目';if(!window.confirm(`「${title}」を削除しますか？\n関連する記録も削除される場合があります。`))return;
    if(kind==='habit'){state.habits=state.habits.filter(h=>h.id!==id);state.habitLogs=state.habitLogs.filter(l=>l.habitId!==id);}
    if(kind==='goal'){state.goals=state.goals.filter(g=>g.id!==id);state.habits.forEach(h=>{if(h.goalId===id)h.goalId='';});state.tasks.forEach(t=>{if(t.goalId===id)t.goalId='';});}
    if(kind==='project'){state.projects=state.projects.filter(p=>p.id!==id);state.tasks.forEach(t=>{if(t.projectId===id)t.projectId='';});}
    if(kind==='task')state.tasks=state.tasks.filter(t=>t.id!==id);
    if(kind==='routine'){state.routines=state.routines.filter(r=>r.id!==id);state.routineLogs=state.routineLogs.filter(l=>l.routineId!==id);}
    closeModal();commit();toast('削除しました');}
  function routineStepSet(id,step,all=false){if(currentKey()>todayKey())return;const r=getRoutine(id);if(!r)return;let log=routineLog(id,currentKey());if(!log){log={id:uid(),routineId:id,date:currentKey(),completed:[],updatedAt:new Date().toISOString()};state.routineLogs.push(log);}if(all)log.completed=(r.steps||[]).map(s=>s.id);else log.completed=(log.completed||[]).includes(step)?log.completed.filter(x=>x!==step):[...(log.completed||[]),step];log.updatedAt=new Date().toISOString();persist();render();}

  function applyAIAdvice(raw){let parsed;try{parsed=JSON.parse(String(raw).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));}catch(e){throw Error('JSON形式として読み取れません。');}if(parsed?.format!=='rhythm-advice-v1'||!Array.isArray(parsed.suggestions))throw Error('RHYTHM用の提案形式ではありません。');if(parsed.suggestions.length>3)throw Error('提案は3件以内にしてください。');let changes=[];for(const item of parsed.suggestions){if(!item||typeof item!=='object')throw Error('提案データが不正です。');const h=getHabit(item.habitId);if(!h)throw Error('紐づく習慣が見つかりません。');const delta={};for(const k of ['cue','fallback']){if(item[k]!==undefined){if(typeof item[k]!=='string'||item[k].length>180)throw Error(`${k}の内容が不正です。`);delta[k]=item[k];}}let standard=item.normalTarget===undefined?num(h.normalTarget):Number(item.normalTarget),minimum=item.minimumTarget===undefined?num(h.minimumTarget):Number(item.minimumTarget);if(!Number.isFinite(standard)||!Number.isFinite(minimum)||standard<=0||minimum<=0||minimum>standard||standard>1000000)throw Error('標準量と最低量の関係が正しくありません。');if(item.normalTarget!==undefined)delta.normalTarget=standard;if(item.minimumTarget!==undefined)delta.minimumTarget=minimum;if(Object.keys(delta).length)changes.push({h,delta,reason:String(item.reason||'').slice(0,140)});}

  // v2 — complete local-first workflows: focus, recovery, calendar, data exports, coaching.

  function focusSeconds(){return focusState.running?Math.max(0,Math.ceil((focusState.until-Date.now())/1000)):focusState.remaining;}

  function focusStart(){if(focusState.running)return;if(focusState.remaining<=0)focusState.remaining=25*60;focusState.until=Date.now()+focusState.remaining*1000;focusState.running=true;saveFocus();render();}

  function renderFocusTimer(){return `<div class="card focus-timer"><div class="card-header"><span class="card-title">FOCUS / 集中タイマー</span><span class="pill">25分</span></div><div class="timer-face" data-focus-clock>${clockValue()}</div><p class="muted" style="font-size:11px;margin-bottom:13px">学習開始までの抵抗を減らす補助機能。終了後の学習実績は別途記録します。</p><div class="split"><button class="btn primary" data-action="${focusState.running?'focus-pause':'focus-start'}">${ico(focusState.running?'pause':'bolt','sm')} ${focusState.running?'一時停止':'開始する'}</button><button class="btn" data-action="focus-reset">${ico('undo','sm')} リセット</button></div></div>`;}
  function renderSmartCoach(){const end=todayKey(),days=rangeDays(end,14),recent=state.habitLogs.filter(l=>days.includes(l.date));const reasons={};recent.filter(l=>['skipped','partial'].includes(l.status)&&l.reason).forEach(l=>reasons[l.reason]=(reasons[l.reason]||0)+1);const top=Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];let message='最初の行動を1つ決めて、あとは始めるだけにしましょう。';if(top&&top[1]>=2){const r=top[0];message=({'疲労':'疲れが障害になっています。負荷を落とした復習や実行時間帯の変更を試しましょう。','時間不足':'予定量が生活時間に収まっているか確認し、優先度の低い行動を減らしましょう。','スマホ・誘惑':'始める前に通知を切り、スマホを視界の外に置いてみましょう。','難しすぎる':'最初の作業をさらに小さく分割し、短い問題から始めましょう。','忘れた':'今ある習慣の直後に紐づけ、行動のきっかけを見える場所に置きましょう。','予定変更':'予定が変わりやすい曜日は時間固定より、前後の行動をきっかけにしましょう。','体調不良':'回復を優先し、休息として記録して再開する条件を決めましょう。'}[r]||'実行できなかった状況を一つ特定し、次週の計画を軽く調整してみましょう。');}else if(state.habits.length>0){const low=state.habits.filter(h=>isHabitScheduled(h,end)&&!habitLog(h.id,end));if(low.length)message=`「${low[0].title}」は ${low[0].minimumTarget}${low[0].unit} から着手できます。`;else message='今日は実行した内容を確認し、明日の最初の行動を一つ決めましょう。';}return `<div class="card coach-card"><div class="card-header"><span class="card-title">SYSTEM COACH</span>${ico('spark')}</div><p class="coach-body">${esc(message)}</p><p class="muted" style="font-size:10px;margin-top:10px">直近14日間の記録を使ったルールベースの提案。AI診断ではありません。</p></div>`;}

  function exportIcs(){const now=new Date(),ts=now.toISOString().replace(/[-:]/g,'').replace(/\..+/,'Z'),hhmm=state.settings.reminderTime||'20:30',hour=Number(hhmm.split(':')[0]),minute=Number(hhmm.split(':')[1]);const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RHYTHM//Calendar Export 2.0//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:RHYTHM 予定'];let events=0;for(let i=0;i<60;i++){const d=addDays(dateKey(new Date()),i),day=dateOf(d);for(const h of state.habits){if(!isHabitScheduled(h,d))continue;const from=d.replaceAll('-','')+'T'+pad(hour)+pad(minute)+'00',toDate=new Date(day.getFullYear(),day.getMonth(),day.getDate(),hour,minute+Math.max(5,Math.min(240,h.unit==='分'?num(h.normalTarget,25):25))),to=dateKey(toDate).replaceAll('-','')+'T'+pad(toDate.getHours())+pad(toDate.getMinutes())+'00';lines.push('BEGIN:VEVENT',`UID:rhythm-${h.id}-${d}@rhythm.local`,`DTSTAMP:${ts}`,`DTSTART:${from}`,`DTEND:${to}`,`SUMMARY:${calendarEscape(h.title)}`,`DESCRIPTION:${calendarEscape('標準 '+h.normalTarget+h.unit+' / 最低 '+h.minimumTarget+h.unit+' / きっかけ '+(h.cue||'未設定'))}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:RHYTHM 習慣の時間','TRIGGER:-PT5M','END:VALARM','END:VEVENT');events++;}for(const t of state.tasks){if(t.status==='done'||t.dueDate!==d)continue;const from=d.replaceAll('-','')+'T'+pad(hour)+pad(minute)+'00',to=d.replaceAll('-','')+'T'+pad(hour)+pad((minute+15)%60)+'00';const endObj=new Date(day.getFullYear(),day.getMonth(),day.getDate(),hour,minute+15);lines.push('BEGIN:VEVENT',`UID:rhythm-task-${t.id}-${d}@rhythm.local`,`DTSTAMP:${ts}`,`DTSTART:${from}`,`DTEND:${dateKey(endObj).replaceAll('-','')}T${pad(endObj.getHours())}${pad(endObj.getMinutes())}00`,`SUMMARY:${calendarEscape('期限: '+t.title)}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:期限の確認','TRIGGER:-PT5M','END:VALARM','END:VEVENT');events++;}}

  function mergeStates(current,incoming){const out=JSON.parse(JSON.stringify(current));for(const key of ['goals','habits','tasks','projects','routines','habitLogs','routineLogs','dailyReviews','reviews']){const arr=out[key]||[];const ids=new Set(arr.map(x=>x.id).filter(Boolean));const keys=new Set(arr.map(x=>key==='habitLogs'?`${x.habitId}:${x.date}`:key==='routineLogs'?`${x.routineId}:${x.date}`:key==='dailyReviews'?x.date:key==='reviews'?x.weekStart:'').filter(Boolean));for(const entry of incoming[key]){const subkey=key==='habitLogs'?`${entry.habitId}:${entry.date}`:key==='routineLogs'?`${entry.routineId}:${entry.date}`:key==='dailyReviews'?entry.date:key==='reviews'?entry.weekStart:'';if((entry.id&&ids.has(entry.id))||(subkey&&keys.has(subkey)))continue;arr.push(entry);if(entry.id)ids.add(entry.id);if(subkey)keys.add(subkey);}out[key]=arr;}return normalizeData(out);}

  });
  document.addEventListener('change',event=>{const target=event.target;
    if(target.id==='import-file'){const file=target.files?.[0];importFile(file,false);target.value='';return;}
    if(target.id==='import-merge-file'){const file=target.files?.[0];importFile(file,true);target.value='';return;}
    if(target.dataset.setting==='reminder-time'){if(/^([01]\d|2[0-3]):[0-5]\d$/.test(target.value)){state.settings.reminderTime=target.value;commit();toast('リマインド時刻を保存しました');}return;}
    if(target.dataset.setting==='cutover'){state.settings.dayBoundaryHour=cap(num(target.value,4),0,6);ui.date=todayKey();commit();toast('1日の区切りを変更しました');return;}
    if(target.dataset.field==='frequency'){const form=target.closest('form');form?.querySelectorAll('[data-freq]').forEach(el=>el.hidden=el.dataset.freq!==target.value);return;}
  });
  document.addEventListener('submit',event=>{if(event.target.id==='entity-form'){event.preventDefault();saveForm(event.target);}});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&ui.modal)closeModal();});
  initialize();
})();

</script>
</head>
<body>
  <div id="app"><div class="boot"><span class="brand-mark">R<span>•</span></span><p>読み込み中…</p></div></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
