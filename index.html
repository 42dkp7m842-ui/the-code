function streak(){const days=new Set(data.reviewDays);let d=today();if(!days.has(d))d=addDays(d,-1);let n=0;while(days.has(d)){n++;d=addDays(d,-1);}return n;}

function hash(s){let h=0;for(let i=0;i<s.length;i++) h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h);}

function renderSettings(){return `<div class="page-heading"><div><p class="eyebrow">PERSONAL CONTROL / SETTINGS</p><h1>設定・データ管理</h1><p class="subhead">振り返る習慣も、大切な言葉も、自分でコントロールする。</p></div></div><div class="settings-grid"><section class="panel settings-panel"><p class="eyebrow">01 / DAILY ROUTINE</p><h3>毎日のレビュー</h3><p>アプリを開いたときに表示する今日の復習と、カレンダー用リマインダーの設定です。</p><div class="setting-group"><div><label class="setting-label" for="daily-count">1回に読み返す言葉の数</label><select class="setting-control" id="daily-count"><option value="3" ${data.settings.dailyCount===3?'selected':''}>3つ（続けやすい）</option><option value="5" ${data.settings.dailyCount===5?'selected':''}>5つ（じっくり）</option><option value="10" ${data.settings.dailyCount===10?'selected':''}>10つ（集中して）</option></select></div><div><label class="setting-label" for="reminder-time">リマインダーの時間</label><input class="setting-control" id="reminder-time" type="time" value="${esc(data.settings.reminderTime||'08:00')}" /></div></div><button class="btn-black" data-action="calendar">${icon('calendar')} カレンダーに毎日の予定を追加</button><p class="setting-note">カレンダー用 .ics ファイルを作ります。端末のカレンダーに登録すると毎日繰り返す予定になります。ブラウザだけでは、アプリを閉じたときのプッシュ通知は行いません。</p></section>
 <section class="panel settings-panel"><p class="eyebrow">02 / PERSONAL ARCHIVE</p><h3>バックアップと復元</h3><p>保存した言葉・ジャンル・復習記録は、この端末のブラウザ内に保存されます。別端末へ移すときにもJSONを使えます。</p><div class="setting-actions"><button class="btn-black" data-action="export">${icon('download')} JSONを書き出す</button><button class="btn-outline" data-action="import">${icon('upload')} JSONを読み込む</button></div><p class="setting-note">同じ端末でもSafariとホーム画面アプリでは保存先が異なる場合があります。大切な言葉は定期的に書き出してください。</p><div class="notice">バックアップはオフラインでも使用できます。外部サーバーやアカウントへの送信は行いません。</div></section>
 <section class="panel settings-panel"><p class="eyebrow">03 / CATEGORIES</p><h3>ジャンルを整える</h3><p>仕事、メンタル、習慣、人生、人間関係など。自分らしいジャンルを自由に増やせます。</p><button class="btn-outline" data-action="categories">＋ ジャンルを管理する</button></section>
 <section class="panel settings-panel"><p class="eyebrow">04 / HOW TO USE</p><h3>iPhoneのホーム画面で使う</h3><p>このフォルダをGitHub PagesなどのHTTPS対応サイトで公開し、iPhoneのSafariから開いて「共有」→「ホーム画面に追加」を選びます。</p><div class="notice">初回読み込み後は基本機能がオフラインでも使えます。データは自動同期されません。端末を変更する前にJSONバックアップを保存してください。</div></section></div>`;}
function renderNav(){ $('#nav-total').textContent=data.quotes.length;$('#top-streak').textContent=streak();$('#review-pulse').classList.toggle('visible',countDue()>0);
 $('#category-nav').innerHTML=data.categories.map(c=>`<button type="button" class="category-link ${ui.view==='library'&&ui.category===c.id?'active':''}" data-category="${esc(c.id)}"><span class="category-dot" style="background:${esc(c.color)}"></span><span>${esc(c.name)}</span><span class="category-number">${data.quotes.filter(q=>q.category===c.id).length}</span></button>`).join('');
 document.querySelectorAll('.primary-nav .nav-link,.setting-link').forEach(el=>el.classList.toggle('active',el.dataset.view===ui.view));

function editQuote(id){const q=id?data.quotes.find(q=>q.id===id):null;if(id&&!q)return;
 const select=data.categories.map(c=>`<option value="${esc(c.id)}" ${(q?.category||'work')===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 const content=`<form id="quote-form"><div class="field"><label for="quote-text">心に残したい言葉 <span style="color:#ad8460">*</span></label><textarea id="quote-text" name="text" maxlength="1000" minlength="1" required placeholder="例：自分の基準を、他人の評価に預けない。">${esc(q?.text||'')}</textarea><div class="hint">本、映画、人の言葉、自分の考え。何でもOKです。</div></div><div class="field-row"><div class="field"><label for="quote-category">ジャンル</label><select id="quote-category" name="category">${select}</select></div><div class="field"><label for="quote-source">出典・自分なりのタイトル</label><input id="quote-source" name="source" maxlength="120" placeholder="例：MY PRINCIPLE / 書籍名" value="${esc(q?.source||'')}" /></div></div><div class="field"><label for="quote-note">自分にとっての意味・使いたい場面</label><textarea id="quote-note" name="note" maxlength="2500" placeholder="なぜ響いた？ どんな行動に変える？">${esc(q?.note||'')}</textarea></div><div class="field"><label for="quote-tags">検索用タグ（任意）</label><input id="quote-tags" name="tags" maxlength="250" placeholder="決断, 自信, 主体性" value="${esc((q?.tags||[]).join(', '))}" /></div><div class="field"><label>おすすめシーン（任意）</label><div class="scene-checks">${[['morning','朝'],['work','仕事'],['anxiety','不安'],['failure','失敗'],['motivation','やる気'],['decision','決断'],['relationships','人間関係'],['challenge','挑戦'],['reset','休息']].map(([value,label])=>`<label class="scene-check"><input type="checkbox" name="scene" value="${value}" ${(q?.scenes||[]).includes(value)?'checked':''} />${label}</label>`).join('')}</div></div><label class="check-label"><input type="checkbox" name="favorite" ${q?.favorite?'checked':''} /> 特に大切な言葉としてお気に入りに登録</label></form>`;
 const footer=`${q?`<button type="button" class="btn-danger" data-action="delete" data-id="${esc(q.id)}">この言葉を削除</button>`:'<span class="muted-small">THE CODE / STAY TRUE.</span>'}<div class="right"><button type="button" class="btn-outline" data-action="close-modal">キャンセル</button><button type="submit" class="btn-black" form="quote-form">${q?'変更を保存':'言葉を保存'} ${icon('arrow')}</button></div>`;
 modal(q?'言葉を編集する':'新しい言葉を追加する',q?'EDIT PRINCIPLE':'ADD TO YOUR CODE',content,footer);
 $('#quote-form').addEventListener('submit',ev=>{ev.preventDefault();const form=new FormData(ev.currentTarget);const text=String(form.get('text')||'').trim();if(!text){toast('言葉を入力してください。');return;}const stamp=new Date().toISOString();const payload={text,category:String(form.get('category')||'other'),source:String(form.get('source')||'').trim(),note:String(form.get('note')||'').trim(),tags:String(form.get('tags')||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).slice(0,20),favorite:form.has('favorite'),scenes:form.getAll('scene').map(String),updatedAt:stamp,example:false};if(q)Object.assign(q,payload);else data.quotes.unshift({...payload,id:uid(),createdAt:stamp,nextReview:today(),lastReviewed:null,reviewCount:0});persist();closeModal();render();toast(q?'言葉を更新しました。':'あなたのコードに言葉を追加しました。');});}
function manageCategories(){const rows=data.categories.map(c=>`<div class="manage-row"><div class="left"><span class="category-dot" style="background:${esc(c.color)}"></span>${esc(c.name)} <span class="muted-small">${data.quotes.filter(q=>q.category===c.id).length}件</span></div><div class="manage-actions"><button type="button" data-action="rename-category" data-id="${esc(c.id)}">名前変更</button>${c.id==='other'?'':`<button class="danger" type="button" data-action="delete-category" data-id="${esc(c.id)}">削除</button>`}</div></div>`).join('');
 modal('ジャンルを管理','ORGANIZE YOUR PRINCIPLES',`<div class="muted-small">ジャンルを追加・変更できます。削除したジャンルの言葉は「その他」に移動します。</div>${rows}<form id="category-form" style="margin-top:23px"><div class="field"><label for="new-category">新しいジャンル名</label><input id="new-category" name="name" maxlength="24" placeholder="例：リーダーシップ、健康、挑戦" required /></div></form>`,`<button type="button" class="btn-outline" data-action="close-modal">閉じる</button><button class="btn-black" form="category-form" type="submit">＋ ジャンルを追加</button>`);
 $('#category-form').addEventListener('submit',ev=>{ev.preventDefault();const name=String(new FormData(ev.currentTarget).get('name')||'').trim();if(!name)return;if(data.categories.some(c=>c.name===name)){toast('同じ名前のジャンルがあります。');return;}if(data.categories.length>=30){toast('ジャンルは30個まで追加できます。');return;}const colors=['#a8997c','#7897a2','#a68c9a','#889a83','#ac8d75','#8899aa','#b49f7e'];data.categories.splice(Math.max(data.categories.length-1,0),0,{id:uid(),name,color:colors[data.categories.length%colors.length],fixed:false});persist();manageCategories();render();toast('ジャンルを追加しました。');});}
function deleteQuote(id){const q=data.quotes.find(q=>q.id===id);if(!q)return;if(!confirm(`「${q.text.slice(0,32)}」を削除しますか？\n削除すると元に戻せません。`))return;data.quotes=data.quotes.filter(x=>x.id!==id);if(ui.session)ui.session=null;persist();closeModal();render();toast('言葉を削除しました。');}
function favorite(id){const q=data.quotes.find(x=>x.id===id);if(!q)return;q.favorite=!q.favorite;q.updatedAt=new Date().toISOString();persist();render();toast(q.favorite?'お気に入りに追加しました。':'お気に入りを解除しました。');}
function rate(days){const s=ui.session;if(!s||s.completed)return;const q=data.quotes.find(q=>q.id===s.ids[s.index]);if(q){q.lastReviewed=today();q.nextReview=addDays(today(),days);q.reviewCount=(Number(q.reviewCount)||0)+1;s.reviewed++;}s.index++;s.showNote=false;if(s.index>=s.ids.length)finishSession();persist();render();}
function download(blob,filename){const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),60000);}
function exportData(){const obj={app:'THE CODE',format:'the-code-backup-v1',exportedAt:new Date().toISOString(),data};download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),`the-code-backup-${today()}.json`);toast('バックアップを書き出しました。');}
function safeImport(raw){let parsed=JSON.parse(raw);if(parsed?.format==='the-code-backup-v1'&&parsed.data)parsed=parsed.data;else if(parsed?.data?.quotes)parsed=parsed.data;
 if(!parsed||!Array.isArray(parsed.quotes)||!Array.isArray(parsed.categories))throw Error('THE CODEのバックアップではありません。');
 const categories=parsed.categories.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.color==='string').slice(0,30).map(c=>({id:c.id,name:c.name.slice(0,45),color:/^#[0-9a-fA-F]{6}$/.test(c.color)?c.color:'#889198',fixed:!!c.fixed}));
 if(!categories.some(c=>c.id==='other'))categories.push(BASE_CATS.find(c=>c.id==='other'));
 const valid=new Set(categories.map(c=>c.id));const quotes=parsed.quotes.filter(q=>q&&typeof q.text==='string'&&q.text.trim()).slice(0,30000).map(q=>({id:typeof q.id==='string'&&q.id?q.id:uid(),category:valid.has(q.category)?q.category:'other',text:q.text.slice(0,1000),note:String(q.note||'').slice(0,2500),source:String(q.source||'').slice(0,120),tags:Array.isArray(q.tags)?q.tags.map(t=>String(t).slice(0,40)).slice(0,20):[],scenes:Array.isArray(q.scenes)?q.scenes.filter(x=>typeof x==='string').slice(0,9):[],favorite:!!q.favorite,example:!!q.example,createdAt:typeof q.createdAt==='string'?q.createdAt:new Date().toISOString(),updatedAt:typeof q.updatedAt==='string'?q.updatedAt:new Date().toISOString(),nextReview:/^\d{4}-\d\d-\d\d$/.test(q.nextReview||'')?q.nextReview:today(),lastReviewed:typeof q.lastReviewed==='string'?q.lastReviewed:null,reviewCount:Math.max(0,Number(q.reviewCount)||0)}));
 return {schema:1,categories,quotes,settings:{dailyCount:[3,5,10].includes(Number(parsed.settings?.dailyCount))?Number(parsed.settings.dailyCount):3,reminderTime:/^\d\d:\d\d$/.test(parsed.settings?.reminderTime||'')?parsed.settings.reminderTime:'08:00'},reviewDays:Array.isArray(parsed.reviewDays)?[...new Set(parsed.reviewDays.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)))]:[]};}
async function importFile(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('12MB以下のファイルを選択してください。');const incoming=safeImport(await file.text());const replace=confirm(`バックアップに${incoming.quotes.length}件の言葉があります。\n\nOK：現在のデータを置き換える\nキャンセル：置き換えず、追加方法を選ぶ`);
 if(replace){data=incoming;}else if(confirm('現在のデータを残して、バックアップの言葉を追加しますか？（同じIDの言葉は重複しません）')){for(const c of incoming.categories){if(!data.categories.some(x=>x.id===c.id)){if(data.categories.length>=30)break;data.categories.push(c);}}const known=new Set(data.quotes.map(q=>q.id));for(const q of incoming.quotes){if(!known.has(q.id)){data.quotes.push(q);known.add(q.id);}}data.reviewDays=[...new Set([...data.reviewDays,...incoming.reviewDays])];}else{return;}
 ui.session=null;ui.search='';ui.filter='all';ui.category='all';persist();render();toast(`${incoming.quotes.length}件のバックアップを読み込みました。`);}catch(e){toast(`読み込み失敗：${e.message}`);}}
function makeCalendar(){const time=(data.settings.reminderTime||'08:00').replace(':','');const first=addDays(today(),1).replace(/-/g,'');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const fmt=s=>s.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//THE CODE//Daily Review//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',`UID:the-code-${uid()}@personal-manifesto`, `DTSTAMP:${stamp}`,`DTSTART:${first}T${time}00`,`DURATION:PT5M`,'RRULE:FREQ=DAILY','SUMMARY:'+fmt('THE CODE｜今日の言葉を読む'),'DESCRIPTION:'+fmt('THE CODEを開き、今日の言葉を3つ読み返す。'),'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:THE CODE - DAILY RITUAL','END:VALARM','END:VEVENT','END:VCALENDAR',''];download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'the-code-daily-ritual.ics');toast('カレンダー用の繰り返し予定を作成しました。');}
function onClick(ev){const target=ev.target.closest('[data-action],[data-view],[data-category],[data-filter]');if(!target)return;
 if(target.dataset.action==='close-modal'){closeModal();return;}
 if(target.dataset.view){ev.preventDefault();navigate(target.dataset.view);return;}
 if(target.dataset.category){ui.category=target.dataset.category;ui.view='library';ui.search='';ui.filter='all';navigate('library');return;}
 if(target.dataset.filter){ui.filter=target.dataset.filter;render();return;}
 const action=target.dataset.action;switch(action){
 case 'add':editQuote();break;case 'edit':editQuote(target.dataset.id);break;case 'delete':deleteQuote(target.dataset.id);break;
 case 'favorite':favorite(target.dataset.id);break;case 'next-featured':ui.featuredOffset++;render();break;
 case 'start-review':ui.session=null;createSession(true);navigate('review');break;
 case 'restart-review':ui.session=null;createSession(true);navigate('review');break;
 case 'quote-review':ui.session=null;createSession(true,target.dataset.id);navigate('review');break;
 case 'toggle-note':if(ui.session){ui.session.showNote=!ui.session.showNote;render();}break;
 case 'rate':rate(Number(target.dataset.days)||1);break;
 case 'categories':manageCategories();break;
 case 'rename-category':{const c=data.categories.find(c=>c.id===target.dataset.id);if(!c)return;const name=prompt('ジャンル名を変更',c.name);if(name===null)return;const fixed=name.trim().slice(0,24);if(!fixed)return toast('ジャンル名を入力してください。');if(data.categories.some(x=>x.id!==c.id&&x.name===fixed))return toast('同じ名前のジャンルがあります。');c.name=fixed;persist();manageCategories();render();toast('ジャンル名を変更しました。');break;}
 case 'delete-category':{const c=data.categories.find(c=>c.id===target.dataset.id);if(!c||c.id==='other')return;if(!confirm(`「${c.name}」を削除しますか？\n含まれる言葉は「その他」に移動します。`))return;data.quotes.forEach(q=>{if(q.category===c.id)q.category='other';});data.categories=data.categories.filter(x=>x.id!==c.id);if(ui.category===c.id)ui.category='all';persist();manageCategories();render();toast('ジャンルを削除しました。');break;}
 case 'reset-filters':ui.category='all';ui.filter='all';ui.search='';render();break;
 case 'export':exportData();break;case 'import':$('#import-file').click();break;case 'calendar':makeCalendar();break;
 }}

    {id:'anxiety', icon:'◈', label:'不安・プレッシャー', desc:'冷静さと自信を取り戻す', cats:['mental'], terms:['不安','恐れ','冷静','感情','自信','評価','判断','落ち着','pressure','control']},
    {id:'failure', icon:'↗', label:'失敗・落ち込んだとき', desc:'失敗から次の一歩へ', cats:['mental','life'], terms:['失敗','間違','成長','立ち直','昨日','比較','一歩','反省','次','失敗']},
    {id:'motivation', icon:'⚡', label:'やる気が出ないとき', desc:'気分に左右されず動く', cats:['discipline','work'], terms:['継続','努力','約束','習慣','行動','積み上げ','毎日','気分','規律','consistency']},
    {id:'decision', icon:'◇', label:'大切な決断をするとき', desc:'自分の価値観で選び抜く', cats:['life','mental'], terms:['決断','選択','判断','迷','自分','基準','意図','優先','決め','choose']},
    {id:'relationships', icon:'◎', label:'人間関係に悩むとき', desc:'誠実さと距離感を見つめる', cats:['relationships','mental'], terms:['他人','関係','誠実','信頼','人','態度','言葉','評価','尊重','character']},
    {id:'challenge', icon:'✦', label:'新しい挑戦の前に', desc:'勇気を出して踏み出す', cats:['work','life'], terms:['挑戦','一歩','勇気','未来','準備','実行','行動','恐れ','可能','成長']},
    {id:'reset', icon:'◌', label:'疲れた・立て直したい', desc:'焦りを手放し自分を戻す', cats:['mental','life'], terms:['休','余白','自分','焦','感情','比較','長期','立て直','ペース','冷静']}
  ];
  const FORMAT = 'the-code-ai-v1';
  const PROMPT = `あなたは「THE CODE」という、自分の人生の行動指針を集めるアプリに登録するための編集者です。これから私が送る文章、写真、メモ、読書ノートから、心に残る言葉・自分の軸になる信条を抽出して整理してください。\n\n【厳守】\n・入力にない内容、人物名、出典を事実として創作しない。判読不能な写真の文字は推測しない。\n・著作物は長い文章をそのまま転載せず、短い引用または独自の言葉による要約にする。引用なら実際の出典を記載し、要約なら「要約」と明示する。\n・言葉は短く、力強く、日常の行動に落とし込める日本語にする。\n・意味が重なるものは統合し、重複登録を避ける。\n・ジャンルは work（仕事・キャリア）、mental（メンタル）、discipline（習慣・自己規律）、life（人生・価値観）、relationships（人間関係）、other（その他）のいずれか。\n・scenes は morning（朝）、work（仕事）、anxiety（不安）、failure（失敗）、motivation（やる気）、decision（決断）、relationships（人間関係）、challenge（挑戦）、reset（休息）から、該当するものを1〜3個選ぶ。\n・source は判明している出典のみ。不明なら「自分の言葉」または「原文からの要約」。note にはこの言葉を日常でどう使うかを1文で記載。\n・説明文やMarkdownのコードフェンスは一切出さず、正しいJSONだけ出力する。\n\n【出力形式】\n{\n  "format": "the-code-ai-v1",\n  "quotes": [\n    {\n      "text": "短く力強い言葉",\n      "category": "work",\n      "source": "出典（不明なら要約）",\n      "note": "いつ・どんな行動に落とし込むか",\n      "tags": ["主体性", "実行"],\n      "scenes": ["work", "challenge"]\n    }\n  ]\n}\n\nこの後に素材を送ります。素材を受け取ってからJSONを作成してください。`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = {scene:'work', offset:0, pending:[], pendingDuplicates:0};
  const getData = () => bridge.data;
  const short = (s,n) => String(s??'').slice(0,n);
  function currentScene(){return SCENES.find(s=>s.id===state.scene)||SCENES[0];}
  function sceneLabel(id){return SCENES.find(s=>s.id===id)?.label || ''}
  function sceneMatch(q, scene){
    const tags = Array.isArray(q.tags)?q.tags.map(x=>String(x).toLowerCase()):[];
    const words = `${q.text||''} ${q.note||''} ${q.source||''}`.toLowerCase();
    const assigned = Array.isArray(q.scenes)?q.scenes:[];
    let score = assigned.includes(scene.id) ? 45 : 0;
    if (scene.cats.includes(q.category)) score += 10;
    for (const term of scene.terms) {
      const word = term.toLowerCase();
      if (tags.some(t=>t.includes(word))) score+=9;
      if (words.includes(word)) score+=4;
    }
    if (q.favorite) score+=2;
    return score;
  }
  function rank(scene){
    const qs=getData().quotes;
    return qs.map((q,i)=>({q,score:sceneMatch(q,scene),tie:((i+state.offset)%Math.max(qs.length,1))})).sort((a,b)=>b.score-a.score||a.tie-b.tie);
  }
  function renderScenes(){
    const scene=currentScene(); const rows=rank(scene); const matches=rows.filter(x=>x.score>2);
    const take = (matches.length>=3?matches:rows).slice(0,3);
    return `<section class="scene-page"><div class="page-heading"><div><p class="eyebrow">SCENE-BASED PRINCIPLES / THE CODE</p><h1>今の自分に、必要な言葉。</h1><p class="subhead">状況を選ぶと、あなたが保存した言葉からおすすめを選びます。</p></div></div>
      <div class="scene-grid" role="group" aria-label="場面を選択">${SCENES.map(s=>`<button type="button" class="scene-choice ${state.scene===s.id?'selected':''}" data-action="scene-select" data-scene="${s.id}" aria-pressed="${state.scene===s.id}"><span class="scene-symbol">${s.icon}</span><span class="scene-text"><strong>${esc(s.label)}</strong><small>${esc(s.desc)}</small></span></button>`).join('')}</div>
      <div class="scene-reco-head"><div><p class="eyebrow">THE RIGHT WORDS / RIGHT NOW</p><h2>${esc(scene.label)}</h2><p>${esc(scene.desc)}。${matches.length<3?'関連する言葉が少ないため、他の保存済みの言葉も含めて表示しています。':'保存された言葉のジャンル・タグ・内容をもとに選んでいます。'}</p></div><button class="btn-outline" type="button" data-action="scene-refresh">別の言葉を見る ↻</button></div>
      ${take.length?`<div class="scene-results">${take.map((it,i)=>`<article class="scene-result"><div class="scene-result-number">0${i+1} / PERSONAL CODE</div><div class="scene-result-quote">${esc(it.q.text)}</div>${it.q.note?`<p class="scene-result-note">${esc(it.q.note)}</p>`:''}<div class="scene-result-foot"><span>${esc(bridge.categoryName(it.q.category))} · ${esc(it.q.source||'MY PRINCIPLE')}</span><button type="button" data-action="quote-review" data-id="${esc(it.q.id)}">この言葉を読む ↗</button></div></article>`).join('')}</div>`:`<div class="empty-state"><h3>まだ言葉がありません。</h3><p>まずは1件追加するか、AIで抽出した言葉を取り込んでください。</p><button class="btn-black" data-action="ai-import">AIで名言を取り込む</button></div>`}
      <div class="scene-bottom"><button type="button" class="btn-outline" data-action="ai-import">＋ AIで抽出した言葉を取り込む</button><p>おすすめは端末内の保存データだけで選定します。AIへの自動送信はありません。</p></div></section>`;
  }
  function decorate(){
    const nav=document.querySelector('.primary-nav');
    if(nav && !nav.querySelector('[data-view="scenes"]')){
      nav.insertAdjacentHTML('beforeend','<button class="nav-link" data-view="scenes" type="button"><span class="nav-icon">✦</span><span>シーン別のおすすめ</span></button><button class="nav-link" data-action="ai-import" type="button"><span class="nav-icon">⇪</span><span>AI名言を一括登録</span></button>');
    }
    document.querySelectorAll('.primary-nav .nav-link[data-view="scenes"]').forEach(el=>el.classList.toggle('active',bridge.ui.view==='scenes'));
    if (bridge.ui.view==='home'){
      const stats=document.querySelector('.stats-grid');
      if(stats && !document.querySelector('.quick-access')) stats.insertAdjacentHTML('afterend',`<section class="quick-access" aria-label="クイックアクセス"><button type="button" data-view="scenes"><span>✦ <b>今の自分に合う言葉</b></span><small>シーン別おすすめを見る →</small></button><button type="button" data-action="ai-import"><span>⇪ <b>AIの名言をまとめて登録</b></span><small>プロンプトをコピー・JSONを取り込む →</small></button></section>`);
    }
    if(bridge.ui.view==='library'){
      const heading=document.querySelector('.page-heading');
      if(heading && !heading.querySelector('[data-action="ai-import"]')) heading.insertAdjacentHTML('beforeend','<button class="btn-outline" type="button" data-action="ai-import">⇪ AI抽出JSONを取り込む</button>');
    }
    if(bridge.ui.view==='settings'){
      const grid=document.querySelector('.settings-grid');
      if(grid && !document.querySelector('.ai-settings-panel')) grid.insertAdjacentHTML('afterbegin',`<section class="panel settings-panel ai-settings-panel"><p class="eyebrow">AI / BULK COLLECTION</p><h3>AIで名言を一括登録</h3><p>専用プロンプトをコピーしてChatGPTなどに渡し、返ってきたJSONを貼り付けて追加できます。既存データは置き換えません。</p><button class="btn-black" data-action="ai-import">⇪ AI取込を開く</button></section>`);
    }
  }
  bridge.extend(renderScenes,decorate);
  function openImporter(){
    state.pending=[];
    bridge.modal('AI抽出した言葉を取り込む','AI COLLECTION / BULK IMPORT',`<div class="ai-importer"><div class="ai-step"><span>01</span><div><h3>AI用プロンプトをコピー</h3><p>ChatGPTなどに貼り付け、続けて本やメモの文章・画像を送ります。</p></div></div><button type="button" class="btn-outline ai-wide" data-action="copy-prompt">プロンプトをコピー <span>▣</span></button><details class="ai-prompt-preview"><summary>プロンプト全文を表示する</summary><textarea readonly rows="9" id="ai-prompt-text">${esc(PROMPT)}</textarea></details>
    <div class="ai-step"><span>02</span><div><h3>AIが返したJSONを貼り付け</h3><p>コードフェンス付きでもOK。既存の言葉は消さず、重複を省いて追加します。</p></div></div><label for="ai-json-input" class="ai-input-label">JSONを入力</label><textarea id="ai-json-input" class="ai-json-input" placeholder='{"format":"the-code-ai-v1","quotes":[{"text":"自分の基準を守る。","category":"mental","note":"...","tags":["自信"],"scenes":["anxiety"]}]}' spellcheck="false" rows="8"></textarea><div class="ai-actions"><button type="button" class="btn-outline" data-action="ai-upload">JSONファイルを選ぶ</button><button type="button" class="btn-black" data-action="ai-preview">内容を確認する →</button></div><input type="file" id="ai-json-file" accept=".json,application/json,text/plain" hidden><div id="ai-preview" role="status" class="ai-preview"></div><p class="ai-footnote">外部AIとの直接連携はありません。貼り付けたデータはこの端末で処理されます。取込後は設定からバックアップを作成してください。</p></div>`,`<button type="button" class="btn-outline" data-action="close-modal">閉じる</button><button class="btn-black" id="ai-import-confirm" data-action="ai-commit" type="button" disabled>取り込む</button>`);
  }
  function normalized(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\s\u3000、，。．・!！?？"“”'‘’「」『』]/g,'');}
  function categoryId(value,text,tags){
    const category=String(value??'').trim().toLowerCase();
    const ids=new Set(getData().categories.map(c=>c.id));
    if(ids.has(category))return category;
    const byName=getData().categories.find(c=>c.name===value); if(byName)return byName.id;
    const rules=[[/仕事|キャリア|会計|監査|経営|business|career|leadership|work/,'work'],[/メンタル|心|不安|感情|精神|mental|mind/,'mental'],[/習慣|規律|努力|継続|学習|discipline|habit/,'discipline'],[/人生|価値観|生き方|life|value/,'life'],[/人間関係|恋愛|信頼|誠実|relationship/,'relationships']];
    for(const [re,id] of rules)if(re.test(category))return id;
    const combined=`${text} ${tags.join(' ')}`;
    for(const [re,id] of rules)if(re.test(combined))return id;
    return 'other';
  }
  function parsedQuote(q){
    if(!q || typeof q!=='object' || Array.isArray(q))return null;
    const text=short(q.text??q.quote??q.word??q.言葉,1000).trim();if(!text)return null;
    const note=short(q.note??q.meaning??q.description??q.メモ,2500).trim();
    const source=short(q.source??q.author??q.出典,120).trim();
    const tags=Array.isArray(q.tags)?q.tags.map(x=>short(x,40).trim()).filter(Boolean).slice(0,20):typeof q.tags==='string'?q.tags.split(/[,、，]/).map(s=>short(s.trim(),40)).filter(Boolean).slice(0,20):[];
    const rawScenes=Array.isArray(q.scenes)?q.scenes:typeof q.scene==='string'?[q.scene]:[];
    const scenes=rawScenes.map(x=>{const str=String(x).trim();return SCENES.find(s=>s.id===str||s.label===str)?.id||''}).filter(Boolean).slice(0,9);
    return {text,note,source,category:categoryId(q.category??q.genre??q.ジャンル,text,tags),tags,scenes,favorite:q.favorite===true};
  }
  function readAI(raw){
    let input=String(raw||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/,'').trim();
    if(input.charCodeAt(0)===0xfeff)input=input.slice(1);
    if(!input)throw Error('JSONを貼り付けるか、ファイルを選択してください。');
    let obj;try{obj=JSON.parse(input)}catch{throw Error('JSONの形式が正しくありません。「JSONだけ出力」とAIに指示してください。')}
    if(obj && obj.format==='the-code-backup-v1')throw Error('これはバックアップです。設定の「JSONを読み込む」を使用してください。');
    const arr=Array.isArray(obj)?obj:obj?.quotes;
    if(!Array.isArray(arr))throw Error('quotes 配列がありません。専用プロンプトのJSON形式をご利用ください。');
    if(arr.length>300)throw Error('一度に取り込めるのは300件までです。分割してください。');
    const known=new Set(getData().quotes.map(q=>normalized(q.text)));
    const pending=[];let duplicates=0;
    for(const item of arr){const q=parsedQuote(item);if(!q)continue;const key=normalized(q.text);if(!key)continue;if(known.has(key)){duplicates++;continue;}known.add(key);pending.push(q);}
    return {pending,duplicates,received:arr.length};
  }
  function previewAI(raw){
    try{
      const r=readAI(raw);state.pending=r.pending;state.pendingDuplicates=r.duplicates;
      const area=document.querySelector('#ai-preview');if(!area)return;
      area.innerHTML=`<div class="ai-preview-success"><b>${r.pending.length}件を追加できます</b><span>元データ ${r.received}件 / 重複 ${r.duplicates}件 / 空欄など ${r.received-r.pending.length-r.duplicates}件</span></div>${r.pending.slice(0,8).map(q=>`<div class="ai-preview-row"><span>${esc(bridge.categoryName(q.category))}</span><p>${esc(q.text)}</p><small>${q.scenes.map(sceneLabel).filter(Boolean).join(' ・ ')||'シーンは内容から自動判定'}</small></div>`).join('')}${r.pending.length>8?`<p class="ai-footnote">ほか ${r.pending.length-8}件</p>`:''}`;
      const commit=document.querySelector('#ai-import-confirm');commit.disabled=r.pending.length===0;commit.textContent=r.pending.length?`${r.pending.length}件を追加する`:'追加できる言葉がありません';
    }catch(e){state.pending=[];const area=document.querySelector('#ai-preview');if(area)area.innerHTML=`<p class="ai-error">${esc(e.message)}</p>`;const commit=document.querySelector('#ai-import-confirm');if(commit)commit.disabled=true;}
  }
  function commitAI(){
    if(!state.pending.length)return;
    const data=getData();const known=new Set(data.quotes.map(q=>normalized(q.text)));
    if(data.quotes.length>=30000){bridge.toast('保存上限に達しています。');return;}
    let n=0;const stamp=new Date().toISOString();
    for(const p of state.pending){if(data.quotes.length>=30000)break;const key=normalized(p.text);if(known.has(key))continue;known.add(key);
      data.quotes.unshift({...p,id:bridge.uid(),createdAt:stamp,updatedAt:stamp,nextReview:bridge.today(),lastReviewed:null,reviewCount:0,example:false,origin:'ai-import'});n++;
    }
    if(!n){bridge.toast('追加できる言葉はありません。');return;}
    if(!bridge.persist()){bridge.toast('保存に失敗しました。空き容量を確認してください。');return;}
    bridge.closeModal();bridge.render();bridge.toast(`${n}件の言葉を追加しました。`);
  }
  async function copyPrompt(){
    try{
      if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(PROMPT);
      else {const t=document.createElement('textarea');t.value=PROMPT;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('copy failed');t.remove();}
      bridge.toast('AI抽出用プロンプトをコピーしました。');
    }catch{const t=document.querySelector('#ai-prompt-text');t?.closest('details')?.setAttribute('open','');t?.focus();t?.select();bridge.toast('自動コピーできませんでした。選択した文章を手動でコピーしてください。');}
  }
  document.addEventListener('click',ev=>{
    const btn=ev.target.closest('[data-action]');if(!btn)return;
    const action=btn.dataset.action;
    if(!['ai-import','copy-prompt','ai-upload','ai-preview','ai-commit','scene-select','scene-refresh'].includes(action))return;
    ev.preventDefault();ev.stopImmediatePropagation();
    switch(action){
      case 'ai-import':openImporter();break;
      case 'copy-prompt':void copyPrompt();break;
      case 'ai-upload':document.querySelector('#ai-json-file')?.click();break;
      case 'ai-preview':previewAI(document.querySelector('#ai-json-input')?.value||'');break;
      case 'ai-commit':commitAI();break;
      case 'scene-select':state.scene=btn.dataset.scene;state.offset=0;bridge.render();break;
      case 'scene-refresh':state.offset++;bridge.render();break;
    }
  },true);
  document.addEventListener('change',async ev=>{
    if(ev.target?.id!=='ai-json-file')return;
    const file=ev.target.files?.[0];if(!file)return;
    try{if(file.size>2*1024*1024)throw Error('JSONファイルは2MB以下にしてください。');
      const text=await file.text();const input=document.querySelector('#ai-json-input');if(input){input.value=text;previewAI(text);}
    }catch(e){const area=document.querySelector('#ai-preview');if(area)area.innerHTML=`<p class="ai-error">${esc(e.message)}</p>`;}
    ev.target.value='';
  });
  // Open a contextually useful scene from a URL, for example #scenes/anxiety.
  const deepScene=location.hash.match(/^#scenes\/([a-z]+)$/);if(deepScene && SCENES.some(s=>s.id===deepScene[1])){state.scene=deepScene[1];bridge.navigate('scenes');}
})();

</script>
</body>
