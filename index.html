 ['work','成果で語る。言い訳では語らない。','今日、成果につながる一手は何か。','OWN THE OUTCOME.'],

function featured(){if(!data.quotes.length)return null;const arr=data.quotes.filter(q=>q.favorite);const group=arr.length?arr:data.quotes;return group[(hash(today())+ui.featuredOffset)%group.length];}
function choiceQueue(){const dt=today();const due=data.quotes.filter(q=>!q.nextReview||q.nextReview<=dt).sort((a,b)=> (a.nextReview||'').localeCompare(b.nextReview||'') || (a.lastReviewed||'').localeCompare(b.lastReviewed||''));const ids=new Set(due.map(q=>q.id));const rotating=data.quotes.filter(q=>!ids.has(q.id)).sort((a,b)=>hash(`${dt}-${a.id}`)-hash(`${dt}-${b.id}`));return [...due,...rotating].slice(0,Math.max(1,Number(data.settings.dailyCount)||3)).map(q=>q.id);}
function filtered(){const term=ui.search.toLowerCase().trim();let arr=data.quotes.filter(q=>(ui.category==='all'||q.category===ui.category)&&(ui.filter!=='favorites'||q.favorite)&&(ui.filter!=='due'||!q.nextReview||q.nextReview<=today())&&(!term||[q.text,q.note,q.source,...(q.tags||[])].join(' ').toLowerCase().includes(term)));
 if(ui.sort==='oldest')arr.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
 else if(ui.sort==='category')arr.sort((a,b)=>cat(a.category).name.localeCompare(cat(b.category).name,'ja'));
 else if(ui.sort==='review')arr.sort((a,b)=>String(a.nextReview||'').localeCompare(String(b.nextReview||'')));
 else arr.sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
 return arr;}
function header(){return `<div class="page-heading"><div><p class="eyebrow">PERSONAL MANIFESTO / THE CODE</p><h1>自分の軸を、言葉にする。</h1><p class="subhead">集める。磨く。読み返す。そして、行動に変える。</p></div></div>`;}
function card(q){return `<article class="quote-card"><div class="quote-card-top">${catBadge(q.category)}<button type="button" class="icon-btn ${q.favorite?'favorite':''}" data-action="favorite" data-id="${esc(q.id)}" aria-label="${q.favorite?'お気に入りを解除':'お気に入りに追加'}" title="お気に入り">${icon('bookmark')}</button></div><p class="quote-body">${esc(q.text)}</p><p class="quote-detail">${q.note?esc(q.note):'<span class="muted-small">一言メモを追加できます</span>'}</p><div class="quote-card-bottom"><span class="card-source">${q.example?'EXAMPLE · ':''}${esc(q.source||'MY PRINCIPLE')}</span><div class="card-actions"><button type="button" data-action="edit" data-id="${esc(q.id)}" aria-label="編集">${icon('edit')}</button><button type="button" data-action="quote-review" data-id="${esc(q.id)}" title="この言葉を読む">読む ↗</button></div></div></article>`;}
function renderHome(){let f=featured();const qcount=data.quotes.length;let parts = `${header()}`;
 parts += f?`<section class="hero" aria-label="今日の言葉"><div class="hero-main"><div class="hero-kicker">TODAY'S PRINCIPLE / 今日の一言</div><h2 class="hero-quote">${esc(f.text)}</h2><div class="hero-bottom"><span class="hero-tag">${esc(cat(f.category).name)}</span><span class="hero-source">${esc(f.source||'MY PERSONAL CODE')}</span></div></div><div class="hero-aside"><div><span class="aside-index">PRINCIPLE NO.<strong>${String(data.quotes.findIndex(x=>x.id===f.id)+1).padStart(2,'0')}</strong></span><div class="hero-rule"></div></div><div><div class="aside-caption">MAKE IT PERSONAL.</div><div class="aside-copy">言葉を眺めるだけでなく、今日の選択に落とし込む。</div></div><div class="hero-side-actions"><button class="icon-dark ${f.favorite?'is-favorite':''}" data-action="favorite" data-id="${esc(f.id)}" aria-label="お気に入り" title="お気に入り">${icon('bookmark')}</button><button class="hero-next" data-action="next-featured" title="別の言葉を表示">次の言葉 →</button></div></div></section>`:
 `<div class="empty-state"><div class="empty-symbol">✦</div><h3>あなたのコードを、ここから。</h3><p>最初の言葉を追加して、自分だけの行動指針をつくりましょう。</p><button class="btn-black" data-action="add">＋ 言葉を追加</button></div>`;
 const stats=[['保存した言葉',qcount,'YOUR COLLECTION','layers'],['復習タイミング',countDue(),'READY TO REVIEW','clock'],['継続日数',streak(),'DAILY STREAK','flame'],['お気に入り',data.quotes.filter(q=>q.favorite).length,'BOOKMARKED','bookmark']];
 parts+=`<div class="stats-grid">${stats.map(s=>`<div class="stat-card"><div class="stat-top"><span>${s[0]}</span><span class="stat-icon">${icon(s[3])}</span></div><div class="stat-value">${s[1]}</div><div class="stat-foot">${s[2]}</div></div>`).join('')}</div>`;
 parts+=`<div class="section-title"><h2>毎日のルーティン <span class="small-label">DAILY OPERATING SYSTEM</span></h2></div><div class="content-split"><div class="panel review-teaser"><div class="panel-kicker">01 / REFLECT & REINFORCE</div><h3>一日${data.settings.dailyCount}つ。<br>自分の言葉を読み直す。</h3><p>今日の行動を決める、数分間の習慣。<br>${reviewedToday()?'今日のレビューは完了しています。':`現在${countDue()}件が復習タイミングです。`}</p><div class="review-teaser-foot"><div class="review-bubbles"><span>01</span><span>02</span><span>03</span></div><button class="btn-black" type="button" data-action="start-review">${reviewedToday()?'もう一度読む':'今日のレビューを始める'} ${icon('arrow')}</button></div></div><div class="panel compact-list"><div class="compact-list-head"><h3>ジャンル別コレクション</h3><button class="small-link" data-action="categories">編集 ↗</button></div><div class="category-progress">${data.categories.map(c=>{const n=data.quotes.filter(q=>q.category===c.id).length;return `<div class="cat-progress-row"><span class="cat-name">${esc(c.name)}</span><div class="progress-track"><span class="progress-fill" style="background:${esc(c.color)};width:${qcount?(n/qcount*100):0}%"></span></div><span class="cat-count">${n}</span></div>`}).join('')}</div></div></div>`;
 parts+=`<div class="section-title"><h2>最近の言葉 <span class="small-label">YOUR PRINCIPLES</span></h2><button data-view="library">すべて見る →</button></div><div class="card-grid">${data.quotes.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,5).map(card).join('')}<button class="new-card" data-action="add"><span class="plus-circle">＋</span><span>新しい言葉を加える</span></button></div>`;
 return parts;}
function renderLibrary(){const arr=filtered();const heading=ui.category==='all'?'言葉のライブラリ':cat(ui.category).name;
 return `<div class="page-heading"><div><p class="eyebrow">THE LIBRARY / COLLECT WHAT MATTERS</p><h1>${esc(heading)}</h1><p class="subhead">心に残った言葉も、自分でつくった信条も。増やして、育てていく。</p></div><button class="btn-black" data-action="add">＋ 言葉を追加</button></div>
 <div class="category-chips"><button class="category-chip ${ui.category==='all'?'active':''}" data-category="all">すべて <span class="cat-count">${data.quotes.length}</span></button>${data.categories.map(c=>`<button class="category-chip ${ui.category===c.id?'active':''}" data-category="${esc(c.id)}"><span class="category-dot" style="background:${esc(c.color)}"></span>${esc(c.name)} <span class="cat-count">${data.quotes.filter(q=>q.category===c.id).length}</span></button>`).join('')}<button class="category-chip" data-action="categories">＋ ジャンルを編集</button></div>
 <div class="library-tools"><div class="filter-pills"><button class="filter-pill ${ui.filter==='all'?'active':''}" data-filter="all">すべて</button><button class="filter-pill ${ui.filter==='favorites'?'active':''}" data-filter="favorites">★ お気に入り</button><button class="filter-pill ${ui.filter==='due'?'active':''}" data-filter="due">↻ 復習タイミング</button></div><div class="search-box">${icon('search')}<input type="search" id="quote-search" aria-label="言葉を検索" placeholder="キーワードで検索" value="${esc(ui.search)}" /></div><select class="sort-select" id="sort-select" aria-label="並び替え"><option value="newest" ${ui.sort==='newest'?'selected':''}>追加した順</option><option value="oldest" ${ui.sort==='oldest'?'selected':''}>古い順</option><option value="category" ${ui.sort==='category'?'selected':''}>ジャンル順</option><option value="review" ${ui.sort==='review'?'selected':''}>次の復習順</option></select></div>
 <div class="section-title"><h2>${arr.length} 件の言葉 <span class="small-label">YOUR PERSONAL COLLECTION</span></h2></div>
 ${arr.length?`<div class="card-grid">${arr.map(card).join('')}<button class="new-card" data-action="add"><span class="plus-circle">＋</span><span>新しい言葉を加える</span></button></div>`:`<div class="empty-state"><div class="empty-symbol">✦</div><h3>ここにはまだ言葉がありません。</h3><p>検索や絞り込みを変えるか、新しい言葉を追加してください。</p><button class="btn-black" data-action="add">＋ 言葉を追加</button> <button class="btn-outline" data-action="reset-filters">絞り込みを解除</button></div>`}`;}
function createSession(force=false,oneId=null){if(ui.session&&!force)return;const ids=oneId?[oneId]:choiceQueue();ui.session={ids,index:0,completed:false,reviewed:0,one:!!oneId,showNote:false};}
function finishSession(){if(!ui.session)return;ui.session.completed=true;if(ui.session.reviewed>0&&!ui.session.one&&!reviewedToday())data.reviewDays.push(today());persist();}
function renderReview(){createSession();const s=ui.session;if(!s.ids.length)return `<div class="review-layout"><div class="page-heading"><div><p class="eyebrow">THE DAILY RITUAL</p><h1>デイリーレビュー</h1></div></div><div class="empty-state"><h3>まだ保存した言葉がありません</h3><p>まずは自分の行動指針をひとつ登録しましょう。</p><button class="btn-black" data-action="add">言葉を追加</button></div></div>`;
 if(s.completed||s.index>=s.ids.length)return `<div class="review-layout"><p class="eyebrow">DAILY RITUAL / COMPLETED</p><div class="panel review-finished"><div class="finish-icon">${icon('check')}</div><h2>今日の積み上げ、完了。</h2><p>読むだけで終わらせず、今日の行動を一つ選んでみましょう。信念は、繰り返した行動からできていきます。</p><div class="finish-stats"><div class="finish-stat"><strong>${s.reviewed}</strong><span>REVIEWED</span></div><div class="finish-stat"><strong>${streak()}</strong><span>DAY STREAK</span></div></div><button class="btn-black" data-action="restart-review">もう一度読む ${icon('rotate')}</button> <button class="btn-outline" data-view="home">ホームに戻る</button></div></div>`;
 const q=data.quotes.find(x=>x.id===s.ids[s.index]);if(!q){s.index++;return renderReview();}
 const frac=((s.index)/s.ids.length)*100;
 return `<div class="review-layout"><div class="page-heading"><div><p class="eyebrow">THE DAILY RITUAL / REPEAT TO REMEMBER</p><h1>${s.one?'この言葉を読む':'今日の自分を整える。'}</h1><p class="subhead">一つずつ読み、心に刻んで、次の復習日を選びます。</p></div></div><div class="review-head"><p class="eyebrow">FOCUS MODE</p><span class="review-count">${String(s.index+1).padStart(2,'0')} / ${String(s.ids.length).padStart(2,'0')}</span></div><div class="review-track"><span style="width:${frac}%"></span></div>
 <div class="focus-card"><div class="focus-top"><span>READ. REFLECT. ACT.</span><span class="focus-tag">${esc(cat(q.category).name)}</span></div><div class="focus-quote">${esc(q.text)}</div><div class="focus-source">${q.source?'— '+esc(q.source):'— MY PERSONAL CODE'}</div></div>
 <div class="panel reflect-panel"><div class="row-between"><h3>この言葉が自分にとって意味すること</h3><button class="text-action" type="button" data-action="toggle-note">${s.showNote?'閉じる −':'メモを見る ＋'}</button></div>${s.showNote?`<p class="reflect-note">${esc(q.note||'まだメモはありません。今の自分にどう響くか、考えてみましょう。')}</p>`:''}</div>
 <div class="reflect-actions"><button class="review-choice" data-action="rate" data-days="1"><strong>また明日読む</strong><small>1日後に再表示</small></button><button class="review-choice" data-action="rate" data-days="3"><strong>意識していく</strong><small>3日後に再表示</small></button><button class="review-choice primary" data-action="rate" data-days="7"><strong>自分の軸にできた</strong><small>7日後に再表示</small></button></div><p class="review-help">どれを選んでも記録が残ります。次のレビュー日は、言葉ごとに自動設定されます。</p></div>`;}
function renderSettings(){return `<div class="page-heading"><div><p class="eyebrow">PERSONAL CONTROL / SETTINGS</p><h1>設定・データ管理</h1><p class="subhead">振り返る習慣も、大切な言葉も、自分でコントロールする。</p></div></div><div class="settings-grid"><section class="panel settings-panel"><p class="eyebrow">01 / DAILY ROUTINE</p><h3>毎日のレビュー</h3><p>アプリを開いたときに表示する今日の復習と、カレンダー用リマインダーの設定です。</p><div class="setting-group"><div><label class="setting-label" for="daily-count">1回に読み返す言葉の数</label><select class="setting-control" id="daily-count"><option value="3" ${data.settings.dailyCount===3?'selected':''}>3つ（続けやすい）</option><option value="5" ${data.settings.dailyCount===5?'selected':''}>5つ（じっくり）</option><option value="10" ${data.settings.dailyCount===10?'selected':''}>10つ（集中して）</option></select></div><div><label class="setting-label" for="reminder-time">リマインダーの時間</label><input class="setting-control" id="reminder-time" type="time" value="${esc(data.settings.reminderTime||'08:00')}" /></div></div><button class="btn-black" data-action="calendar">${icon('calendar')} カレンダーに毎日の予定を追加</button><p class="setting-note">カレンダー用 .ics ファイルを作ります。端末のカレンダーに登録すると毎日繰り返す予定になります。ブラウザだけでは、アプリを閉じたときのプッシュ通知は行いません。</p></section>
 <section class="panel settings-panel"><p class="eyebrow">02 / PERSONAL ARCHIVE</p><h3>バックアップと復元</h3><p>保存した言葉・ジャンル・復習記録は、この端末のブラウザ内に保存されます。別端末へ移すときにもJSONを使えます。</p><div class="setting-actions"><button class="btn-black" data-action="export">${icon('download')} JSONを書き出す</button><button class="btn-outline" data-action="import">${icon('upload')} JSONを読み込む</button></div><p class="setting-note">同じ端末でもSafariとホーム画面アプリでは保存先が異なる場合があります。大切な言葉は定期的に書き出してください。</p><div class="notice">バックアップはオフラインでも使用できます。外部サーバーやアカウントへの送信は行いません。</div></section>
 <section class="panel settings-panel"><p class="eyebrow">03 / CATEGORIES</p><h3>ジャンルを整える</h3><p>仕事、メンタル、習慣、人生、人間関係など。自分らしいジャンルを自由に増やせます。</p><button class="btn-outline" data-action="categories">＋ ジャンルを管理する</button></section>
 <section class="panel settings-panel"><p class="eyebrow">04 / HOW TO USE</p><h3>iPhoneのホーム画面で使う</h3><p>このフォルダをGitHub PagesなどのHTTPS対応サイトで公開し、iPhoneのSafariから開いて「共有」→「ホーム画面に追加」を選びます。</p><div class="notice">初回読み込み後は基本機能がオフラインでも使えます。データは自動同期されません。端末を変更する前にJSONバックアップを保存してください。</div></section></div>`;}
function renderNav(){ $('#nav-total').textContent=data.quotes.length;$('#top-streak').textContent=streak();$('#review-pulse').classList.toggle('visible',countDue()>0);
 $('#category-nav').innerHTML=data.categories.map(c=>`<button type="button" class="category-link ${ui.view==='library'&&ui.category===c.id?'active':''}" data-category="${esc(c.id)}"><span class="category-dot" style="background:${esc(c.color)}"></span><span>${esc(c.name)}</span><span class="category-number">${data.quotes.filter(q=>q.category===c.id).length}</span></button>`).join('');
 document.querySelectorAll('.primary-nav .nav-link,.setting-link').forEach(el=>el.classList.toggle('active',el.dataset.view===ui.view));
 $('#current-date').textContent=new Intl.DateTimeFormat('ja-JP',{month:'short',day:'numeric',weekday:'short'}).format(new Date());$('#copyright-year').textContent=new Date().getFullYear();}
function render(){renderNav();const main=$('#main-content');main.innerHTML=ui.view==='home'?renderHome():ui.view==='library'?renderLibrary():ui.view==='review'?renderReview():renderSettings();}
let toastTimer=null;function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
function closeMenu(){$('#sidebar').classList.remove('open');$('#sidebar-scrim').classList.remove('visible');}
function navigate(view){ui.view=view;if(view==='review')createSession();closeMenu();render();window.scrollTo({top:0,behavior:'instant'});}
function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow='';}
function modal(title,kicker,content,footer){document.body.style.overflow='hidden';$('#modal-root').innerHTML=`<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><div><p>${esc(kicker)}</p><h2 id="modal-title">${esc(title)}</h2></div><button type="button" class="modal-close" data-action="close-modal" aria-label="閉じる">×</button></div><div class="modal-content">${content}</div><div class="modal-footer">${footer}</div></div></div>`;const inp=$('#modal-root input:not([type=checkbox])');if(inp)inp.focus();}
function editQuote(id){const q=id?data.quotes.find(q=>q.id===id):null;if(id&&!q)return;
 const select=data.categories.map(c=>`<option value="${esc(c.id)}" ${(q?.category||'work')===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
 const content=`<form id="quote-form"><div class="field"><label for="quote-text">心に残したい言葉 <span style="color:#ad8460">*</span></label><textarea id="quote-text" name="text" maxlength="1000" minlength="1" required placeholder="例：自分の基準を、他人の評価に預けない。">${esc(q?.text||'')}</textarea><div class="hint">本、映画、人の言葉、自分の考え。何でもOKです。</div></div><div class="field-row"><div class="field"><label for="quote-category">ジャンル</label><select id="quote-category" name="category">${select}</select></div><div class="field"><label for="quote-source">出典・自分なりのタイトル</label><input id="quote-source" name="source" maxlength="120" placeholder="例：MY PRINCIPLE / 書籍名" value="${esc(q?.source||'')}" /></div></div><div class="field"><label for="quote-note">自分にとっての意味・使いたい場面</label><textarea id="quote-note" name="note" maxlength="2500" placeholder="なぜ響いた？ どんな行動に変える？">${esc(q?.note||'')}</textarea></div><div class="field"><label for="quote-tags">検索用タグ（任意）</label><input id="quote-tags" name="tags" maxlength="250" placeholder="決断, 自信, 主体性" value="${esc((q?.tags||[]).join(', '))}" /></div><label class="check-label"><input type="checkbox" name="favorite" ${q?.favorite?'checked':''} /> 特に大切な言葉としてお気に入りに登録</label></form>`;
 const footer=`${q?`<button type="button" class="btn-danger" data-action="delete" data-id="${esc(q.id)}">この言葉を削除</button>`:'<span class="muted-small">THE CODE / STAY TRUE.</span>'}<div class="right"><button type="button" class="btn-outline" data-action="close-modal">キャンセル</button><button type="submit" class="btn-black" form="quote-form">${q?'変更を保存':'言葉を保存'} ${icon('arrow')}</button></div>`;
 modal(q?'言葉を編集する':'新しい言葉を追加する',q?'EDIT PRINCIPLE':'ADD TO YOUR CODE',content,footer);
 $('#quote-form').addEventListener('submit',ev=>{ev.preventDefault();const form=new FormData(ev.currentTarget);const text=String(form.get('text')||'').trim();if(!text){toast('言葉を入力してください。');return;}const stamp=new Date().toISOString();const payload={text,category:String(form.get('category')||'other'),source:String(form.get('source')||'').trim(),note:String(form.get('note')||'').trim(),tags:String(form.get('tags')||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean).slice(0,20),favorite:form.has('favorite'),updatedAt:stamp,example:false};if(q)Object.assign(q,payload);else data.quotes.unshift({...payload,id:uid(),createdAt:stamp,nextReview:today(),lastReviewed:null,reviewCount:0});persist();closeModal();render();toast(q?'言葉を更新しました。':'あなたのコードに言葉を追加しました。');});}
function manageCategories(){const rows=data.categories.map(c=>`<div class="manage-row"><div class="left"><span class="category-dot" style="background:${esc(c.color)}"></span>${esc(c.name)} <span class="muted-small">${data.quotes.filter(q=>q.category===c.id).length}件</span></div><div class="manage-actions"><button type="button" data-action="rename-category" data-id="${esc(c.id)}">名前変更</button>${c.id==='other'?'':`<button class="danger" type="button" data-action="delete-category" data-id="${esc(c.id)}">削除</button>`}</div></div>`).join('');
 modal('ジャンルを管理','ORGANIZE YOUR PRINCIPLES',`<div class="muted-small">ジャンルを追加・変更できます。削除したジャンルの言葉は「その他」に移動します。</div>${rows}<form id="category-form" style="margin-top:23px"><div class="field"><label for="new-category">新しいジャンル名</label><input id="new-category" name="name" maxlength="24" placeholder="例：リーダーシップ、健康、挑戦" required /></div></form>`,`<button type="button" class="btn-outline" data-action="close-modal">閉じる</button><button class="btn-black" form="category-form" type="submit">＋ ジャンルを追加</button>`);
 $('#category-form').addEventListener('submit',ev=>{ev.preventDefault();const name=String(new FormData(ev.currentTarget).get('name')||'').trim();if(!name)return;if(data.categories.some(c=>c.name===name)){toast('同じ名前のジャンルがあります。');return;}if(data.categories.length>=30){toast('ジャンルは30個まで追加できます。');return;}const colors=['#a8997c','#7897a2','#a68c9a','#889a83','#ac8d75','#8899aa','#b49f7e'];data.categories.splice(Math.max(data.categories.length-1,0),0,{id:uid(),name,color:colors[data.categories.length%colors.length],fixed:false});persist();manageCategories();render();toast('ジャンルを追加しました。');});}
function deleteQuote(id){const q=data.quotes.find(q=>q.id===id);if(!q)return;if(!confirm(`「${q.text.slice(0,32)}」を削除しますか？\n削除すると元に戻せません。`))return;data.quotes=data.quotes.filter(x=>x.id!==id);if(ui.session)ui.session=null;persist();closeModal();render();toast('言葉を削除しました。');}
function favorite(id){const q=data.quotes.find(x=>x.id===id);if(!q)return;q.favorite=!q.favorite;q.updatedAt=new Date().toISOString();persist();render();toast(q.favorite?'お気に入りに追加しました。':'お気に入りを解除しました。');}
function rate(days){const s=ui.session;if(!s||s.completed)return;const q=data.quotes.find(q=>q.id===s.ids[s.index]);if(q){q.lastReviewed=today();q.nextReview=addDays(today(),days);q.reviewCount=(Number(q.reviewCount)||0)+1;s.reviewed++;}s.index++;s.showNote=false;if(s.index>=s.ids.length)finishSession();persist();render();}
function download(blob,filename){const href=URL.createObjectURL(blob);const a=document.createElement('a');a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),60000);}
function exportData(){const obj={app:'THE CODE',format:'the-code-backup-v1',exportedAt:new Date().toISOString(),data};download(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),`the-code-backup-${today()}.json`);toast('バックアップを書き出しました。');}
function safeImport(raw){let parsed=JSON.parse(raw);if(parsed?.format==='the-code-backup-v1'&&parsed.data)parsed=parsed.data;else if(parsed?.data?.quotes)parsed=parsed.data;
 if(!parsed||!Array.isArray(parsed.quotes)||!Array.isArray(parsed.categories))throw Error('THE CODEのバックアップではありません。');
 const categories=parsed.categories.filter(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.color==='string').slice(0,30).map(c=>({id:c.id,name:c.name.slice(0,45),color:/^#[0-9a-fA-F]{6}$/.test(c.color)?c.color:'#889198',fixed:!!c.fixed}));
 if(!categories.some(c=>c.id==='other'))categories.push(BASE_CATS.find(c=>c.id==='other'));
 const valid=new Set(categories.map(c=>c.id));const quotes=parsed.quotes.filter(q=>q&&typeof q.text==='string'&&q.text.trim()).slice(0,30000).map(q=>({id:typeof q.id==='string'&&q.id?q.id:uid(),category:valid.has(q.category)?q.category:'other',text:q.text.slice(0,1000),note:String(q.note||'').slice(0,2500),source:String(q.source||'').slice(0,120),tags:Array.isArray(q.tags)?q.tags.map(t=>String(t).slice(0,40)).slice(0,20):[],favorite:!!q.favorite,example:!!q.example,createdAt:typeof q.createdAt==='string'?q.createdAt:new Date().toISOString(),updatedAt:typeof q.updatedAt==='string'?q.updatedAt:new Date().toISOString(),nextReview:/^\d{4}-\d\d-\d\d$/.test(q.nextReview||'')?q.nextReview:today(),lastReviewed:typeof q.lastReviewed==='string'?q.lastReviewed:null,reviewCount:Math.max(0,Number(q.reviewCount)||0)}));
 return {schema:1,categories,quotes,settings:{dailyCount:[3,5,10].includes(Number(parsed.settings?.dailyCount))?Number(parsed.settings.dailyCount):3,reminderTime:/^\d\d:\d\d$/.test(parsed.settings?.reminderTime||'')?parsed.settings.reminderTime:'08:00'},reviewDays:Array.isArray(parsed.reviewDays)?[...new Set(parsed.reviewDays.filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)))]:[]};}
async function importFile(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('12MB以下のファイルを選択してください。');const incoming=safeImport(await file.text());const replace=confirm(`バックアップに${incoming.quotes.length}件の言葉があります。\n\nOK：現在のデータを置き換える\nキャンセル：置き換えず、追加方法を選ぶ`);
 if(replace){data=incoming;}else if(confirm('現在のデータを残して、バックアップの言葉を追加しますか？（同じIDの言葉は重複しません）')){for(const c of incoming.categories){if(!data.categories.some(x=>x.id===c.id)){if(data.categories.length>=30)break;data.categories.push(c);}}const known=new Set(data.quotes.map(q=>q.id));for(const q of incoming.quotes){if(!known.has(q.id)){data.quotes.push(q);known.add(q.id);}}data.reviewDays=[...new Set([...data.reviewDays,...incoming.reviewDays])];}else{return;}
 ui.session=null;ui.search='';ui.filter='all';ui.category='all';persist();render();toast(`${incoming.quotes.length}件のバックアップを読み込みました。`);}catch(e){toast(`読み込み失敗：${e.message}`);}}
function makeCalendar(){const time=(data.settings.reminderTime||'08:00').replace(':','');const first=addDays(today(),1).replace(/-/g,'');const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const fmt=s=>s.replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//THE CODE//Daily Review//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',`UID:the-code-${uid()}@personal-manifesto`, `DTSTAMP:${stamp}`,`DTSTART:${first}T${time}00`,`DURATION:PT5M`,'RRULE:FREQ=DAILY','SUMMARY:'+fmt('THE CODE｜今日の言葉を読む'),'DESCRIPTION:'+fmt('THE CODEを開き、今日の言葉を3つ読み返す。'),'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:THE CODE - DAILY RITUAL','END:VALARM','END:VEVENT','END:VCALENDAR',''];download(new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),'the-code-daily-ritual.ics');toast('カレンダー用の繰り返し予定を作成しました。');}
function onClick(ev){const target=ev.target.closest('[data-action],[data-view],[data-category],[data-filter]');if(!target)return;
 if(target.dataset.action==='close-modal'){closeModal();return;}
 if(target.dataset.view){ev.preventDefault();navigate(target.dataset.view);return;}
 if(target.dataset.category){ui.category=target.dataset.category;ui.view='library';ui.search='';ui.filter='all';navigate('library');return;}
 if(target.dataset.filter){ui.filter=target.dataset.filter;render();return;}
 const action=target.dataset.action;switch(action){
 case 'add':editQuote();break;case 'edit':editQuote(target.dataset.id);break;case 'delete':deleteQuote(target.dataset.id);break;
 case 'favorite':favorite(target.dataset.id);break;case 'next-featured':ui.featuredOffset++;render();break;
 case 'start-review':ui.session=null;createSession(true);navigate('review');break;
 case 'restart-review':ui.session=null;createSession(true);navigate('review');break;
 case 'quote-review':ui.session=null;createSession(true,target.dataset.id);navigate('review');break;
 case 'toggle-note':if(ui.session){ui.session.showNote=!ui.session.showNote;render();}break;
 case 'rate':rate(Number(target.dataset.days)||1);break;
 case 'categories':manageCategories();break;
 case 'rename-category':{const c=data.categories.find(c=>c.id===target.dataset.id);if(!c)return;const name=prompt('ジャンル名を変更',c.name);if(name===null)return;const fixed=name.trim().slice(0,24);if(!fixed)return toast('ジャンル名を入力してください。');if(data.categories.some(x=>x.id!==c.id&&x.name===fixed))return toast('同じ名前のジャンルがあります。');c.name=fixed;persist();manageCategories();render();toast('ジャンル名を変更しました。');break;}
 case 'delete-category':{const c=data.categories.find(c=>c.id===target.dataset.id);if(!c||c.id==='other')return;if(!confirm(`「${c.name}」を削除しますか？\n含まれる言葉は「その他」に移動します。`))return;data.quotes.forEach(q=>{if(q.category===c.id)q.category='other';});data.categories=data.categories.filter(x=>x.id!==c.id);if(ui.category===c.id)ui.category='all';persist();manageCategories();render();toast('ジャンルを削除しました。');break;}
 case 'reset-filters':ui.category='all';ui.filter='all';ui.search='';render();break;
 case 'export':exportData();break;case 'import':$('#import-file').click();break;case 'calendar':makeCalendar();break;
 }}
document.addEventListener('click',ev=>{if(ev.target.classList?.contains('modal-overlay'))closeModal();else onClick(ev);});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if((ev.metaKey||ev.ctrlKey)&&ev.key==='k'&&!$('#modal-root').innerHTML){ev.preventDefault();ui.view='library';render();$('#quote-search')?.focus();}});
document.addEventListener('input',ev=>{if(ev.target.id==='quote-search'){const start=ev.target.selectionStart;ui.search=ev.target.value;const grid=$('.card-grid');const list=filtered();if(grid){grid.innerHTML=list.map(card).join('')+`<button class="new-card" data-action="add"><span class="plus-circle">＋</span><span>新しい言葉を加える</span></button>`;const n=$('.section-title h2');if(n)n.innerHTML=`${list.length} 件の言葉 <span class="small-label">YOUR PERSONAL COLLECTION</span>`;}else{render();$('#quote-search')?.focus();} }});
document.addEventListener('change',ev=>{if(ev.target.id==='sort-select'){ui.sort=ev.target.value;render();}if(ev.target.id==='daily-count'){data.settings.dailyCount=Number(ev.target.value);ui.session=null;persist();render();toast('レビューの件数を変更しました。');}if(ev.target.id==='reminder-time'){data.settings.reminderTime=ev.target.value||'08:00';persist();toast('リマインダー時刻を更新しました。');}});
$('#import-file').addEventListener('change',async ev=>{const file=ev.target.files?.[0];await importFile(file);ev.target.value='';});
$('#mobile-menu').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#sidebar-scrim').classList.toggle('visible');});
$('#sidebar-scrim').addEventListener('click',closeMenu);
render();
})();

  </script>
